function confirmPetEvolution(petId, moedas, cristais) {
    STATS.moedas -= moedas;
    STATS.inventory.petCrystals -= cristais;
    STATS.pets.evoLevel[petId] = (STATS.pets.evoLevel[petId] || 0) + 1;
    
    if (typeof saveStats === 'function') saveStats();
    if (typeof triggerScreenShake === 'function') triggerScreenShake();
    
    toast('🎇 LIMIT BREAK! Seu mascote ascendeu e pode subir de nível novamente!', 'var(--gold)');
    openStoreModal(); // Volta pra loja e mostra que desativou a trava
}
// ✨ MODAL DE ASCENSÃO DO JOGADOR (AGORA COM EXIGÊNCIA DE ACERTOS E COM PRESSÃO DE TEMPO!!)
function openPlayerAscensionModal() {
  
  // ✨ BLINDAGEM MESTRA: Garante que o inventário exista antes de ler as Centelhas!
    if (!STATS) STATS = {};
    if (!STATS.inventory) {
        STATS.inventory = { 
            magicHints: 0, skips: 0, shields: 0, doubleCoins: 0, miniShields: 0, 
            doubleXp: 0, petCrystals: 0, playerSparks: 0,
            boxBronze: 0, boxPrata: 0, boxOuro: 0
        };
    }
    const rank = getUserTitle();
    
    if (STATS.achievements === undefined) STATS.achievements = {};
    if (STATS.achievements.currentPrestige === undefined) STATS.achievements.currentPrestige = 1;
    if (STATS.totalAcertos === undefined) STATS.totalAcertos = 0;
    if (STATS.acertosComRelogio === undefined) STATS.acertosComRelogio = 0; // Memória do Relógio
    
    const currentPrestige = STATS.achievements.currentPrestige;
    const acertosAtuais = STATS.totalAcertos;
    const acertosRelogioAtuais = STATS.acertosComRelogio;
    
    // 🚨 OS REQUISITOS (A Matemática do Sofrimento Máximo)
    const reqMoedas = 50000 * currentPrestige;
    const reqCentelhas = 1 * currentPrestige;
    const reqAcertos = 1000 * currentPrestige; 
    const reqAcertosRelogio = 1500 * currentPrestige; // ✨ Exigência do Relógio Ativado!
    
    // Checagens
    
    const hasMoedas = STATS.moedas >= reqMoedas;
    const hasCentelhas = (STATS.inventory.playerSparks || 0) >= reqCentelhas;
    const hasAcertos = acertosAtuais >= reqAcertos;
    const hasAcertosRelogio = acertosRelogioAtuais >= reqAcertosRelogio;
    const currentXP = rank.totalXpAccumulated;
    const maxXP = rank.totalXpToAscend;
    const remainingXP = Math.max(0, maxXP - currentXP);
    const xpPercent = Math.min(100, (currentXP / maxXP) * 100);
    let isXpMaxed = rank.isMaxed;
    // ✅ para mostrar o xp exedente no modal
    const xpReal = rank.totalXP;
    const xpExcedente = Math.max(0, xpReal - maxXP);
    // Tem que ter TUDO para poder subir
    const canAscend = isXpMaxed && hasMoedas && hasCentelhas && hasAcertos && hasAcertosRelogio;

    let html = `
    <h3 style="color:#00f5ff; text-transform:uppercase; font-weight:bold; text-shadow:0 0 10px rgba(0,245,255,0.4)">⚡ Ascensão do Herói</h3>
    <p style="font-size:12px; color:var(--stone2); margin-bottom:15px">Evolua sua Bolinha para o Prestígio <b>${currentPrestige + 1}</b>! Prove seu domínio absoluto e rapidez sob pressão para ascender.</p>
    
    <div style="background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; padding:15px; margin-bottom:15px">
        <div style="font-weight:bold; color:var(--gold); margin-bottom:10px; font-size:14px">Requisitos de Prestígio:</div>
        <div class="xpWrap">
  <div class="xpTop">
    <span>XP</span>
    
    <span>
  ${isXpMaxed 
    ? `MAX (${xpReal.toLocaleString()} / ${maxXP.toLocaleString()})${xpExcedente > 0 ? ` <span style="color:#ffd700; font-size:11px">+${xpExcedente.toLocaleString()} excedente</span>` : ``}`
    : `${currentXP.toLocaleString()} / ${maxXP.toLocaleString()} • Restam ${remainingXP.toLocaleString()}`
  }
</span>
  </div>

  <div class="xpBar">
    <div class="xpFill" style="width:${xpPercent}%"></div>
  </div>
  </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px">
            <span>✨ Nível Máximo Atingido:</span>
            <span style="color:${isXpMaxed ? 'var(--green)' : 'var(--red)'}; font-weight:bold">${isXpMaxed ? 'Sim' : 'Não'}</span>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px">
            <span>🎯 Cartas Acertadas:</span>
            <span style="color:${hasAcertos ? 'var(--green)' : 'var(--red)'}; font-weight:bold">${acertosAtuais.toLocaleString()} / ${reqAcertos.toLocaleString()}</span>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px">
            <span>⏱️ Acertos sob Pressão (Relógio):</span>
            <span style="color:${hasAcertosRelogio ? 'var(--green)' : 'var(--red)'}; font-weight:bold">${acertosRelogioAtuais.toLocaleString()} / ${reqAcertosRelogio.toLocaleString()}</span>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px">
            <span>🪙 Tributo em Ouro:</span>
            <span style="color:${hasMoedas ? 'var(--green)' : 'var(--red)'}; font-weight:bold">${STATS.moedas.toLocaleString()} / ${reqMoedas.toLocaleString()}</span>
        </div>
        
        <div style="display:flex; justify-content:space-between; font-size:13px">
            <span>⚡ Centelhas Divinas:</span>
            <span style="color:${hasCentelhas ? 'var(--green)' : 'var(--red)'}; font-weight:bold">${(STATS.inventory.playerSparks || 0)} / ${reqCentelhas}</span>
        </div>
    </div>
    
    <div class="btn-row">
        <button class="btn ghost" onclick="closeModal()">Mais Tarde</button>
        <button class="btn success" style="background:#00f5ff; color:#000; font-weight:bold" ${canAscend ? '' : 'disabled style="opacity:0.4"'} onclick="confirmPlayerAscension(${reqMoedas}, ${reqCentelhas})">
            ${canAscend ? '⬆️ SUBIR PARA PRESTÍGIO ' + (currentPrestige + 1) : '🔒 REQUISITOS NÃO ATINGIDOS'}
        </button>
    </div>`;
    
    openModal(html);
}

function confirmPlayerAscension(moedas, centelhas) {
    STATS.moedas -= moedas;
    STATS.inventory.playerSparks -= centelhas;
    STATS.achievements.currentPrestige++; 
    
    // ✅ RESETA o histórico para que todos os títulos deem prêmio novamente!
    STATS.highestLevelEver = -1;
    
    if (typeof saveStats === 'function') saveStats();
    
    toast(`⚡ ASCENSÃO SUPREMA! Você agora é Prestígio ${STATS.achievements.currentPrestige}!`, 'var(--blue)');
    closeModal();
    updateHeader(); 
}
// ✨ SISTEMA DE VENDA (Casa de Penhores Atualizada e Anti-Fraude)
function sellStoreItem(itemId, basePrice, isPet) {
    if (isPet) {
        if (STATS.pets.active === itemId) {
            toast('⚠️ Desequipe o mascote antes de vendê-lo!', 'var(--red)');
            return;
        }
        
        const lvl = getPetRealLevel(itemId);
        const multiplier = 0.30 + (lvl * 0.02);
        const sellValue = Math.floor(basePrice * multiplier);
        
        if (!confirm(`Deseja vender seu mascote ${itemId.toUpperCase()} (Nv. ${lvl}) por ${sellValue} 🪙? Todo o nível será perdido para sempre!`)) return;
        
        STATS.pets.owned = STATS.pets.owned.filter(p => p !== itemId);
        STATS.pets.affinity[itemId] = 0;
        if (STATS.pets.evoLevel) STATS.pets.evoLevel[itemId] = 0;
        
        STATS.moedas += sellValue;
        toast(`Mascote vendido por ${sellValue} 🪙!`, 'var(--gold)');
        
    } else if (itemId === 'vidas') {
        // ✨ REGRA DAS VIDAS
        if (STATS.vidas <= 1) {
            toast('Você não pode vender sua última vida!', 'err');
            return;
        }
        const sellValue = Math.floor(100 * 0.30); // Vida custa 100
        STATS.vidas--;
        STATS.moedas += sellValue;
        toast(`Vida vendida por ${sellValue} 🪙!`, 'var(--gold)');
        updateHeader();
        
    } else {
        // ✨ VENDA DE ITENS E CAIXAS
        if (!STATS.inventory[itemId] || STATS.inventory[itemId] <= 0) {
            toast('Você não tem este item para vender!', 'err');
            return;
        }

        // ANTI-GLITCH: Néctar e Água dão 20 cargas por 250 moedas. 
        // Se ele vender 1 carga, ganha a fração equivalente! (250 / 20 = 12.5 por carga. 30% disso = 3 moedas).
        let sellValue = Math.floor(basePrice * 0.30);
        
        if (itemId === 'doubleCoins' || itemId === 'doubleXp') {
            sellValue = 3; // 3 moedas por cada "carga" vendida individualmente
        }
        
        STATS.inventory[itemId]--;
        STATS.moedas += sellValue;
        toast(`Item vendido por ${sellValue} 🪙!`, 'var(--gold)');
    }
    
    if (typeof saveStats === 'function') saveStats();
    openStoreModal(); 
    updateHeader(); 
}
// ✨ APAGA A COR (SOMENTE SE TOCAR FORA DOS BOTÕES)
function limparLuzDeFundo(event) {
    // 📱 A CORREÇÃO MOBILE: Se o jogador tocou em um botão de resposta, ignora e deixa o jogo rodar!
    if (event && event.target) {
        if (event.target.tagName === 'BUTTON' || event.target.closest('button') || event.target.closest('.btn')) {
            return; // Sai da função sem fazer nada
        }
    }

    // Se tocou em um lugar vazio, apaga a luz normalmente
    if (document.body.style.backgroundColor !== "") {
        document.body.style.backgroundColor = "";
        clearTimeout(timerCorDeFundo); 
    }
}

// 📱 Removemos os rastreadores agressivos (touchstart/mousedown) que bugavam o celular
// e usamos apenas o clique padrão, que funciona perfeitamente em PC e Mobile!
document.addEventListener('click', limparLuzDeFundo);
// ✨ SISTEMA DE CONTROLE DE QUANTIDADE (- 1 +)
function changeStoreQty(itemId, amount, basePrice, baseSellPrice) {
    const qtySpan = document.getElementById(`qty_${itemId}`);
    if (!qtySpan) return;
    
    let currentQty = parseInt(qtySpan.innerText);
    let newQty = currentQty + amount;
    
    // Limites: Mínimo 1, Máximo 100 por vez
    if (newQty < 1) newQty = 1; 
    if (newQty > 100) newQty = 100; 
    
    qtySpan.innerText = newQty;
    
    // Atualiza o texto dos botões com a multiplicação na hora!
    const btnBuy = document.getElementById(`btn_buy_${itemId}`);
    const btnSell = document.getElementById(`btn_sell_${itemId}`);
    
    if (btnBuy) btnBuy.innerText = `Comprar: ${basePrice * newQty} 🪙`;
    if (btnSell) btnSell.innerText = `Vender: +${baseSellPrice * newQty} 🪙`;
}

// ✨ EXECUTOR SILENCIOSO DE COMPRA/VENDA EM MASSA
function runBulkAction(itemId, actionStr) {
    let qtySpan = document.getElementById(`qty_${itemId}`);
    let qty = qtySpan ? parseInt(qtySpan.innerText) : 1;
    
    // Se for 1, só executa normal
    if (qty === 1) {
        new Function(actionStr)(); 
        setTimeout(openStoreModal, 150); 
        return;
    }

    let oldCoins = STATS.moedas || 0;
    let oldItemQty = STATS.inventory[itemId] || 0;

    // 🤫 Muta os avisos para não travar a tela
    const originalToast = window.toast;
    window.toast = function(){}; 

    // Simula os múltiplos cliques
    for(let i = 0; i < qty; i++) {
        new Function(actionStr)();
    }

    // 🔊 Devolve os avisos e calcula o total que mudou
    window.toast = originalToast;
    let diffItem = (STATS.inventory[itemId] || 0) - oldItemQty;

    if (diffItem > 0) {
        toast(`✅ Adquirido ${diffItem}x com sucesso!`, 'ok');
    } else if (diffItem < 0) {
        toast(`💰 Vendido ${Math.abs(diffItem)}x com sucesso!`, 'gold');
    } else {
        toast(`❌ Recursos insuficientes para tudo.`, 'err');
    }

    openStoreModal(); 
}

async function factoryReset() {
    // 🛡️ Travas de Segurança
    if (!confirm("⚠️ ATENÇÃO EXTREMA: Isso vai apagar TODAS as palavras, Moedas, Pets e Nível do aplicativo! Tem certeza?")) return;
    if (!confirm("Último aviso! Você já fez o backup (Exportar) desse perfil para não perder?")) return;

    try {
        const db = await openDB();
        
        // Entra no banco de dados com poder de edição
        const tx = db.transaction([STORE_APP, STORE_WORDS], 'readwrite');
        
        // 💣 Joga a bomba atômica nas gavetas do IndexedDB
        tx.objectStore(STORE_APP).clear();
        tx.objectStore(STORE_WORDS).clear();
        
        tx.oncomplete = () => {
            // Limpa as variáveis da memória
            W = [];
            STATS = {};
            
            // Limpa o LocalStorage (onde ficam configurações como tema escuro, etc)
            localStorage.clear(); 
            
            if (typeof toast === 'function') toast("Tudo apagado! Reiniciando...", "err");
            
            // Dá o F5 automático na página após 1 segundo para começar do zero
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        };
        
        tx.onerror = () => {
            console.error("Erro ao apagar banco:", tx.error);
            if (typeof toast === 'function') toast("Erro ao apagar o banco de dados.", "err");
        };

    } catch (e) { 
        console.error("Falha no Reset:", e); 
        alert("Erro ao formatar. Limpe o histórico do navegador manualmente.");
    }
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
(async function init() {
  await load(); // ✨ ADICIONE A PALAVRA "await" AQUI 
  await new Promise(r => setTimeout(r, 900));
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  render();
})();

/* ═══════════════════════════════════════
   🧠 MOTOR DE MEMÓRIA DE INTERFACE E GAVETAS (INTELIGENTE)
═══════════════════════════════════════ */
const ignoreList = ['fw_type', 'fw_lang_word', 'fw_lang_def', 'fw_class']; 

// O EventListener original (Intacto!)
document.addEventListener('change', (e) => {
  
  if (e.target.tagName === 'SELECT' && e.target.id && !ignoreList.includes(e.target.id)) {
    localStorage.setItem('ui_pref_' + e.target.id, e.target.value);
  }
  if (e.target.classList.contains('custom-mode-cb')) {
    localStorage.setItem('ui_pref_cb_' + e.target.value, e.target.checked);
  }
  // ✨ NOVA LÓGICA: Salva as configurações numéricas (como o Relógio)
  if (e.target.id === 'inputTimerInterval') {
      localStorage.setItem('config_timerMinInterval', e.target.value);
      configJogo.timerMinInterval = parseInt(e.target.value) || 0; // Já engatilha no motor do jogo!
  }
  if (e.target.classList.contains('config-cb')) {
      localStorage.setItem('config_' + e.target.id, e.target.checked);
      configJogo[e.target.id] = e.target.checked; // Salva direto na memória global
  }
}, true);

// ✨ NOVA FUNÇÃO: O botão que abre e fecha as Gavetas Manuais
function toggleSection(sectionId) {
    const content = document.getElementById(sectionId + '-content');
    const icon = document.getElementById(sectionId + '-icon');
    if (!content) return;
    
    const isCollapsed = content.style.display === 'none';
    
    if (isCollapsed) {
        content.style.display = 'block';
        if (icon) icon.textContent = '▼';
        localStorage.setItem('ui_toggle_' + sectionId, 'open'); // Salva no dispositivo
    } else {
        content.style.display = 'none';
        if (icon) icon.textContent = '▶';
        localStorage.setItem('ui_toggle_' + sectionId, 'closed'); // Salva no dispositivo
    }
}

// O seu Observador Ninja Único!
const uiObserver = new MutationObserver(() => {
  let needsListUpdate = false;
  let needsImportUpdate = false;

  // --- 1. A SUA LÓGICA ORIGINAL (Selects e Checkboxes) ---
  document.querySelectorAll('select[id]').forEach(sel => {
    if (ignoreList.includes(sel.id)) return; 
    
    const saved = localStorage.getItem('ui_pref_' + sel.id);
    if (saved !== null && sel.value !== saved) {
      const optionExists = Array.from(sel.options).some(opt => opt.value === saved);
      if (optionExists) {
        sel.value = saved;
        if (sel.id === 'wordCat' || sel.id === 'wordSort') needsListUpdate = true;
        if (sel.id === 'importType') needsImportUpdate = true;
      }
    }
  });
  
  document.querySelectorAll('.custom-mode-cb').forEach(cb => {
    const saved = localStorage.getItem('ui_pref_cb_' + cb.value);
    if (saved !== null) {
      const isChecked = (saved === 'true');
      if (cb.checked !== isChecked) {
        cb.checked = isChecked;
        const label = cb.closest('label');
        if (label) label.style.borderColor = isChecked ? 'var(--gold)' : 'var(--border2)';
      }
    }
  });

// --- 2. ✨ A NOVA LÓGICA (Vigiando as Gavetas do App, Loja E Missões!) ---
  const sections = [
      'sec-manual', 'sec-magic', 'sec-rev', 'sec-free', // Originais
      'sec-store-gacha', 'sec-store-items', 'sec-store-pets', 'sec-store-food', 'sec-store-upgrades', // Da loja
      'sec-quest-daily', 'sec-quest-weekly', 'sec-quest-achiev' // ✨ AS NOVAS DAS MISSÕES!
  ];
  
  sections.forEach(sec => {
      const content = document.getElementById(sec + '-content');
      const icon = document.getElementById(sec + '-icon');
      
      // Se a gaveta acabou de renderizar na tela...
      if (content && !content.dataset.loaded) {
          const state = localStorage.getItem('ui_toggle_' + sec) || 'open'; 
          
          if (state === 'closed') {
              content.style.display = 'none';
              if (icon) icon.textContent = '▶';
          } else {
              content.style.display = 'block';
              if (icon) icon.textContent = '▼';
          }
          
          content.dataset.loaded = 'true'; // Evita piscar a tela infinitamente!
      }
  });
// --- 3. ✨ VIGIANDO E CARREGANDO AS CONFIGURAÇÕES GLOBAIS ---
  const inputTimer = document.getElementById('inputTimerInterval');
  if (inputTimer && !inputTimer.dataset.loaded) {
      const savedTimer = localStorage.getItem('config_timerMinInterval');
      if (savedTimer !== null) {
          inputTimer.value = savedTimer; // Atualiza o HTML
          configJogo.timerMinInterval = parseInt(savedTimer) || 0; // Sincroniza a memória do jogo!
      }
      inputTimer.dataset.loaded = 'true'; // Coloca a tag de segurança para não piscar
  }
  // Dispara as atualizações visuais finais do seu código original
  if (needsListUpdate && typeof updateWordList === 'function') updateWordList();
  if (needsImportUpdate && typeof handleImportTypeChange === 'function') handleImportTypeChange();
});

// Liga o observador unificado!
uiObserver.observe(document.body, { childList: true, subtree: true });

</script>

async function importWords() {
  const txt = document.getElementById('importTA').value;
  if (!txt.trim()) { toast('Cole o texto primeiro!', 'err'); return; }
  
  const defaultLangWord = gv('importLangWord') || 'pt-BR';
  const defaultLangDef = gv('importLangDef') || 'pt-BR';
  const defaultCategory = gv('importCat') || 'geral';

  const lines = txt.split('\n').filter(l => l.trim().length > 0);
  let added = 0;
  
  const parseLangTag = (str, fallbackLang) => {
    if (!str) return { text: '', lang: fallbackLang };
    let s = str.trim();
    const match = s.match(/^~(pt|en|es|fr|de|it)\b\s*/i);
    if (match) {
      const codeMap = { pt:'pt-BR', en:'en-US', es:'es-ES', fr:'fr-FR', de:'de-DE', it:'it-IT' };
      const lang = codeMap[match[1].toLowerCase()];
      const text = s.substring(match[0].length).trim();
      return { text, lang }; 
    }
    return { text: s, lang: fallbackLang }; 
  };
  
  for (let line of lines) {
     const parts = line.split('|').map(s => s.trim());
     if (parts.length < 2) continue; 
     
     const wP = parseLangTag(parts[0], defaultLangWord);
     const dP = parseLangTag(parts[1], defaultLangDef);
     const eP = parseLangTag(parts[2], defaultLangDef);
     const sP = parseLangTag(parts[3], defaultLangDef);
     const aP = parseLangTag(parts[4], defaultLangDef);
     
     const cat = parts[5] ? parts[5].trim() : defaultCategory;
     const emoji = parts[6] ? parts[6].trim() : '';
     
     let cType = 'normal';
     if(cat.toLowerCase().includes('técnica')) cType = 'técnica';
     if(cat.toLowerCase().includes('falácia')) cType = 'falácia';
     
     W.push(mkCard({ 
       word: wP.text, definition: dP.text, example: eP.text, synonyms: sP.text, antonyms: aP.text,
       category: cat, image: emoji, cardType: cType, 
       langWord: wP.lang, langDef: dP.lang, langEx: eP.lang, langSyn: sP.lang, langAnt: aP.lang 
     }));
     added++;
     
     if (sP.text) {
       W.push(mkCard({ 
         word: wP.text, definition: sP.text, example: eP.text, category: cat, image: emoji, cardType: 'sinônimo',
         langWord: wP.lang, langDef: sP.lang, langEx: eP.lang 
       }));
       added++;
     }
     
     if (aP.text) {
       W.push(mkCard({ 
         word: wP.text, definition: aP.text, example: eP.text, category: cat, image: emoji, cardType: 'antônimo',
         langWord: wP.lang, langDef: aP.lang, langEx: eP.lang 
       }));
       added++;
     }
  }
  
  // ✨ RASTREADOR DA CONQUISTA (Atualiza o montante todo de uma vez!)
  if (typeof STATS !== 'undefined' && STATS.achievements && STATS.achievements.list) {
      const achMaker = STATS.achievements.list.find(a => a.id === 'ach_add_words');
      if (achMaker && achMaker.progress < achMaker.target) {
          achMaker.progress += added;
          if (achMaker.progress >= achMaker.target) {
              achMaker.progress = achMaker.target; 
              setTimeout(() => { 
                  if (typeof toast === 'function') toast(`🏆 CONQUISTA DESBLOQUEADA: ${achMaker.name}!`, '#00f5ff'); 
                  if (typeof shootConfetti === 'function') shootConfetti(); 
              }, 500);
          }
          if (typeof saveStats === 'function') saveStats();
      }
  }
  // ✨ RASTREADOR DE DIÁRIAS/SEMANAIS PARA ADIÇÃO DE PALAVRAS
  if (typeof STATS !== 'undefined') {
      if (STATS.quests) {
          let qAdd = STATS.quests.find(q => q.id === 'q_add_words');
          if (qAdd && qAdd.progress < qAdd.target) qAdd.progress += added;
      }
      if (STATS.weeklyQuests) {
          let wqAdd = STATS.weeklyQuests.find(wq => wq.id === 'wq_add_words');
          if (wqAdd && wqAdd.progress < wqAdd.target) wqAdd.progress += added;
      }
  }
  await save();
  toast(`✨ Importação Mágica concluída! ${added} cartas criadas.`, 'gold');
  document.getElementById('importTA').value = '';
  render(); 
}

function previewImport() {
  const raw = document.getElementById('importTA')?.value || '';
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const prev = document.getElementById('importPreview');
  
  if (!prev) return;
  if (!lines.length) { prev.innerHTML = ''; return; }
  
  const items = lines.slice(0, 5).map(line => {
        // Usa a mesma regra de separação nova: '|' ou Tab
    const parts = line.split(/\s*\|\s*|\t/).map(p => p.trim());
    return `<div style="padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:var(--gold2);font-family:'Cinzel',serif">${esc(parts[0]||'')}</span> — <span style="font-style:italic;color:var(--stone2)">${esc(parts[1]||'')}</span></div>`;

function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => { // ✨ Adicionado async aqui
    try {
      const d = JSON.parse(ev.target.result);
      if (d.words && Array.isArray(d.words)) {
        let added = 0;
        d.words.forEach(w => {
          const existing = W.find(x => x.word.toLowerCase() === w.word.toLowerCase() && x.cardType === w.cardType);
          if (!existing) { 
            W.push(w); added++; 
          } else if (!existing.image && w.image) {
            // ✨ Se a palavra já existe mas estava sem imagem, ele "puxa" a imagem do backup!
            existing.image = w.image; 
          }
        });
        if (d.stats) STATS = {...STATS, ...d.stats};
        await save(); // ✨ Salva com segurança
        toast(`${added} palavras importadas/atualizadas!`, 'gold'); render();
      }
    } catch { toast('Arquivo inválido!', 'err'); }
  };
  reader.readAsText(file);
}

// ✨ O CÉREBRO DAS DICAS (Consumo por Letra/Palavra)
function getSmartHint(mode, sess, card) {
    let target = card.word;
    
    if (mode === 'syntax') {
        if (sess.isSynonymMatch) {
            const missing = sess.syntaxTargetWords.filter(w => !sess.syntaxAnswer.map(id => sess.syntaxPool.find(p=>p.id===id).word).includes(w));
            if (missing.length > 0) return `Falta: "${missing[0]}"`;
            return "Todos os itens selecionados!";
        } else {
            const wordsArr = sess.syntaxTarget.split(/\s+/);
            const nextIndex = sess.syntaxAnswer.length;
            if (nextIndex < wordsArr.length) return `A próxima palavra é: "${wordsArr[nextIndex]}"`;
            return "Frase completa!";
        }
    } 
    else if (mode === 'cloze') {
        const nextIndex = sess.clozeUserAnswers.length;
        if (nextIndex < sess.clozeAnswers.length) return `A próxima lacuna é: "${sess.clozeAnswers[nextIndex]}"`;
        return "Todas as lacunas preenchidas!";
    } 
    else if (mode === 'spell') {
        const cleanTarget = (sess.spellTarget || target).replace(/[\s\u200B-\u200D\uFEFF]/g, '').toUpperCase();
        const nextIndex = sess.spellAnswer.length;
        if (nextIndex < cleanTarget.length) return `A próxima letra é: "${cleanTarget[nextIndex]}"`;
        return "Palavra completa!";
    }
    else {
        // Modos de Digitação e Contexto
        if (mode === 'scramble' && sess.scrambleTarget) target = sess.scrambleTarget;
        else if ((mode === 'type' || mode === 'context') && (card.cardType === 'sinônimo' || card.cardType === 'antônimo')) {
            const valids = getValidAnswers(card);
            target = valids[0]; 
        }
        const cleanTarget = target.replace(/[\s\u200B-\u200D\uFEFF]/g, '');
        
        if (sess.hintUsed) {
            // Dica Normal (Punição de SM-2): Mostra metade da palavra grátis
            const showLen = Math.max(2, Math.floor(cleanTarget.length / 2));
            return `Começa com: "${cleanTarget.substring(0, showLen).toUpperCase()}..."`;
        } else {
            // Dica Mágica: Mostra exatamente 1 letra a mais para CADA ITEM GASTO!
            const showLen = Math.min(sess.magicHintsActive || 1, cleanTarget.length);
            return `Revelado: "${cleanTarget.substring(0, showLen).toUpperCase()}${(showLen < cleanTarget.length) ? '...' : ''}"`;
        }
    }
}

function updateDynamicHint() {
    const sess = studySession;
    if (!sess || (!sess.hintUsed && !sess.magicHintVisible)) return;
    const card = sess.queue[sess.current];
    const mode = sess.currentAdaptiveMode || studyMode;
    sess.hintText = getSmartHint(mode, sess, card);
}

function useMagicHint() {
  const sess = studySession;
  if (!sess || sess.hintUsed) return; // Se já usou a normal, não precisa da mágica
  
  const card = sess.queue[sess.current];
  const mode = sess.currentAdaptiveMode || studyMode;
  
  // Trava para não gastar dicas à toa se a palavra já estiver toda revelada
  if (mode === 'type' || mode === 'context') {
      const cleanTarget = card.word.replace(/[\s\u200B-\u200D\uFEFF]/g, '');
      if (sess.magicHintsActive >= cleanTarget.length) {
          toast('A palavra inteira já foi revelada!', 'gold');
          return;
      }
  }

  // ✨ O SEGREDO AQUI: Só barra se NÃO tiver hack E não tiver estoque
  if (!configJogo.dicasInfinitas && (!STATS.inventory || STATS.inventory.magicHints <= 0)) {
      toast('Você não tem Dicas de Atena!', 'err');
      if (typeof triggerScreenShake === 'function') triggerScreenShake();
      return;
  }
  
  // Só desconta se NÃO for infinito
  if (!configJogo.dicasInfinitas) {
      STATS.inventory.magicHints--;
  }
  
  if (typeof saveStats === 'function') saveStats();
  
  sess.magicHintUsed = true; 
  sess.magicHintVisible = true; // Faz a caixinha aparecer
  sess.magicHintsActive = (sess.magicHintsActive || 0) + 1; // Acumula o número de letras compradas
  
  updateDynamicHint();
  
  // ✨ Mensagem personalizada se for Hack
  if (configJogo.dicasInfinitas) {
      toast('✨ Dica do Modo Deus!', 'var(--red)');
  } else {
      toast('✨ -1 Dica Gasta', 'gold');
  }
  
  render(); 
}

// ✨ INICIA O MODO CUSTOMIZADO LENDO DA TELA OU DA MEMÓRIA
function startCustomSession(category, isFreeMode) {
    // 1. Tenta pegar da tela (caso a pessoa tenha acabado de clicar no modal)
    let selectedModes = Array.from(document.querySelectorAll('.custom-mode-cb:checked')).map(cb => cb.value);
    
    // 2. Se a tela estiver fechada (botão Início Rápido), pega da memória do navegador!
    if (selectedModes.length === 0) {
        const saved = localStorage.getItem('savedCustomModes');
        if (saved) {
            selectedModes = JSON.parse(saved);
        }
    }

    // 3. Se a memória também estiver vazia, avisa o jogador
    if (selectedModes.length === 0) {
        if (typeof toast === 'function') toast('Selecione pelo menos um modo na engrenagem ⚙️!');
        return;
    }

    // 4. Salva a escolha por segurança e inicia o jogo!
    localStorage.setItem('savedCustomModes', JSON.stringify(selectedModes));
    if (typeof closeModal === 'function') closeModal();
    
    startSession('custom', category, selectedModes, isFreeMode);
}

async function saveNewWord() { 
  const type = gv('fw_type');
  const word = gv('fw_word');
  const def = gv('fw_def');
  if (!word || !def) { toast('Palavra e definição são obrigatórias', 'err'); return; }
  
  const ex = gv('fw_ex'), syn = gv('fw_syn'), ant = gv('fw_ant');
  const ph = gv('fw_ph'), cat = gv('fw_cat'), wc = gv('fw_class');
  
  const tags = gv('fw_tags'), img = gv('fw_image_data');
  const lw = gv('fw_lang_word'), ld = gv('fw_lang_def'), lex = gv('fw_lang_ex');
  const lsyn = gv('fw_lang_syn'), lant = gv('fw_lang_ant');

  // ✨ PUXAMOS O CONTADOR PARA O TOPO
  let added = 0; 

  if (type === 'universal') {
    W.push(mkCard({ word, definition: def, example: ex, synonyms: syn, antonyms: ant, phonetic: ph, category: cat, wordClass: wc, tags, langWord: lw, langDef: ld, langEx: lex, langSyn: lsyn, langAnt: lant, image: img, cardType: 'normal' }));
    added++;
    
    if (syn) { W.push(mkCard({ word, definition: syn, example: ex, category: cat, langWord: lw, langDef: lsyn, langEx: lex, cardType: 'sinônimo', image: img })); added++; }
    if (ant) { W.push(mkCard({ word, definition: ant, example: ex, category: cat, langWord: lw, langDef: lant, langEx: lex, cardType: 'antônimo', image: img })); added++; }
    
    toast(`✨ Mágica! ${added} cartas geradas para "${word}"!`, 'gold');
  } else {
    W.push(mkCard({ word, definition: def, example: ex, synonyms: syn, antonyms: ant, phonetic: ph, category: cat, wordClass: wc, tags, langWord: lw, langDef: ld, langEx: lex, langSyn: lsyn, langAnt: lant, image: img, cardType: type }));
    added = 1; // Se for normal, adiciona 1 na conta!
    toast(`"${word}" adicionada ao léxico!`, 'gold');
  }

  // ✨ RASTREADOR DA CONQUISTA (Usa a variável 'added')
  if (typeof STATS !== 'undefined' && STATS.achievements && STATS.achievements.list) {
      const achMaker = STATS.achievements.list.find(a => a.id === 'ach_add_words');
      if (achMaker && achMaker.progress < achMaker.target) {
          achMaker.progress += added;
          if (achMaker.progress >= achMaker.target) {
              achMaker.progress = achMaker.target; // Trava no limite máximo
              setTimeout(() => { 
                  if (typeof toast === 'function') toast(`🏆 CONQUISTA DESBLOQUEADA: ${achMaker.name}!`, '#00f5ff'); 
                  if (typeof shootConfetti === 'function') shootConfetti(); 
              }, 500);
          }
          if (typeof saveStats === 'function') saveStats();
      }
  }
  // ✨ RASTREADOR DE DIÁRIAS/SEMANAIS PARA ADIÇÃO DE PALAVRAS
  if (typeof STATS !== 'undefined') {
      if (STATS.quests) {
          let qAdd = STATS.quests.find(q => q.id === 'q_add_words');
          if (qAdd && qAdd.progress < qAdd.target) qAdd.progress += added;
      }
      if (STATS.weeklyQuests) {
          let wqAdd = STATS.weeklyQuests.find(wq => wq.id === 'wq_add_words');
          if (wqAdd && wqAdd.progress < wqAdd.target) wqAdd.progress += added;
      }
  }
  await save(); 
  document.getElementById('addForm').innerHTML = buildWordForm();
  render();
}

// ✨ SISTEMA HÍBRIDO DE PRESTÍGIO E XP INFINITO (Com Progressão RPG Real!)
function getUserTitle() {
  if (!STATS.earnedXP) STATS.earnedXP = 0;
  
  if (STATS.achievements === undefined) STATS.achievements = {};
  if (STATS.achievements.currentPrestige === undefined) STATS.achievements.currentPrestige = 1;
  
  const prestige = STATS.achievements.currentPrestige; 
  
  const baseXP = W.length * 10; 
  const totalXP = baseXP + STATS.earnedXP;
  
  // ✨ MOTOR DE NÍVEIS RPG (A Dificuldade Escala!)
  let remainingXP = totalXP;
  let level = 0;
  let nextXP = 1000;
  
  // Multiplicador de Prestígio (Ex: P1 = 1x normal, P2 = 1.5x mais difícil, P3 = 2x mais difícil...)
  const prestigeMult = 1 + ((prestige - 1) * 0.5);

  // O jogo "compra" os níveis com o seu XP até o XP acabar
  while (true) {
      // A FÓRMULA DO SOFRIMENTO: Custa 1000 base + 200 para cada nível que você já tem. 
      // E no final, ainda é multiplicado pelo seu Prestígio atual!
      nextXP = Math.floor((1000 + (level * 200)) * prestigeMult);
      
      if (remainingXP >= nextXP) {
          remainingXP -= nextXP; // Paga o preço do nível
          level++;               // Sobe de nível!
      } else {
          break; // O XP acabou, para de subir!
      }
  }
  
  let currentLevelXP = remainingXP; // O que sobrou é a sua barra atual
  
  const titles = [
    { t: 'Plebeu', icon: '⛺' }, { t: 'Noviço', icon: '🪶' }, { t: 'Iniciado', icon: '📘' },
    { t: 'Aprendiz', icon: '📖' }, { t: 'Discípulo', icon: '📚' }, { t: 'Leitor', icon: '👀' },

    { t: 'Persuasor', icon: '🎯' }, { t: 'Convincente', icon: '💬' }, { t: 'Influente', icon: '🌐' },
    { t: 'Filósofo', icon: '🏛️' }, { t: 'Sofista', icon: '🎓' }, { t: 'Sábio', icon: '🦉' },
    { t: 'Erudito', icon: '📚✨' }, { t: 'Mentor', icon: '🧑‍🏫' }, { t: 'Mestre', icon: '🎓' },
    { t: 'Tribuno', icon: '🦁' }, { t: 'Magistrado', icon: '⚖️' }, { t: 'Preceptor', icon: '📘' },
    { t: 'Senador', icon: '📜' }, { t: 'Cônsul', icon: '🦅' }, { t: 'Oráculo', icon: '🔮' },
    { t: 'Arconte', icon: '👑' }, { t: 'Estratégico', icon: '♟️' }, { t: 'Dominante', icon: '💪' },
    { t: 'Ascendente', icon: '⬆️' }, { t: 'Ilustre', icon: '✨' }, { t: 'Exímio', icon: '💎' },
    { t: 'Magnífico', icon: '🌟' }, { t: 'Supremo', icon: '🔥' }, { t: 'Lendário', icon: '⚡' },
    { t: 'Imortal', icon: '♾️' }, { t: 'Retor', icon: '🏆' }, { t: 'Eminente', icon: '👑✨' },
    { t: 'Ícone', icon: '🌠' }, { t: 'Mítico', icon: '🐉' }, { t: 'Apogeu', icon: '🌅' },
    { t: 'Ápice', icon: '🚀' }, { t: 'Demóstenes', icon: '👑🔥' }
  ];
  
  // ✨ A SUPER TRAVA DE SEGURANÇA (Para o Prestígio Atual)
  const maxLevelForPrestige = prestige * titles.length; 
  
  let isMaxed = false;
  if (level >= maxLevelForPrestige) {
      level = maxLevelForPrestige - 1; 
      
      // Recalcula o tamanho da última barra para ela ficar cheia no visual
      nextXP = Math.floor((1000 + (level * 200)) * prestigeMult);
      currentLevelXP = nextXP; 
      isMaxed = true; 
  }
  // ✅ NOVO: Calcula o XP total necessário para ascender (soma de TODOS os níveis)
  let totalXpToAscend = 0;
  for (let i = 0; i < maxLevelForPrestige; i++) {
      totalXpToAscend += Math.floor((1000 + (i * 200)) * prestigeMult);
  }

  // XP acumulado do jogador em direção à ascensão (limitado ao teto)
  const totalXpAccumulated = Math.min(totalXP, totalXpToAscend);
  const titleIndex = level % titles.length;

  return {

      icon: titles[titleIndex].icon,
      color: color,
      prestige: prestige,
      level: level,
      currentXP: currentLevelXP,
      nextXP: nextXP,
      isMaxed: isMaxed, 
      totalXpAccumulated: totalXpAccumulated,
      totalXpToAscend: totalXpToAscend,

// ✨ SISTEMA DE LIMIT BREAK (XP acumulando em Segundo Plano)
function getPetMaxLevel(petId) {
    if (!STATS.pets.evoLevel) STATS.pets.evoLevel = {};
    const evo = STATS.pets.evoLevel[petId] || 0;
    return (evo + 1) * 10; // Evolução 0 = Trava no 10. Evolução 1 = 20...
}

function getPetRealLevel(petId) {
    const xpAtual = STATS.pets.affinity[petId] || 0;
    return Math.floor(xpAtual / 50) + 1; // O nível "Invisível" que acumula infinitamente
}

function getPetCappedLevel(petId) {
    // O nível que realmente dá poder ao pet (Fica preso no teto até você pagar)
    return Math.min(getPetRealLevel(petId), getPetMaxLevel(petId));
}

function isPetCapped(petId) {
    // Se o nível invisível for igual ou maior que o limite, acende o botão da Loja!
    return getPetRealLevel(petId) >= getPetMaxLevel(petId);
}

function toggleTimer() {

// ✨ PULAR CARTA SEM PUNIR O ALGORITMO
function skipCardWithoutPenalty() {
   const sess = studySession;
   if (!sess) return;
   
   // Remove a carta atual da fila sem alterar seu status no banco de dados
   sess.queue.splice(sess.current, 1);
   
   // Limpa os status para a próxima carta
   sess.currentAdaptiveMode = null; 
   clearTimeout(sess.timerId);
   
   render(); // O render vai recarregar a tela automaticamente na próxima carta
}

// ✨ RELÓGIO DA SOBREVIVÊNCIA (Motor Contínuo - Imune a Redraw)
function startSurvivalTimer(seconds) {
    // 1. Limpa o motor anterior para não termos dois relógios brigando
    clearInterval(studySession.timerId);
    
    // 2. 🕒 REGISTRO DE TEMPO: Salva a hora exata do sistema (Impossível de bugar)
    studySession.timerStartTime = Date.now();
    studySession.maxTimeLimit = seconds * 1000;
    studySession.timeLeft = studySession.maxTimeLimit; 

    // 3. O "Game Loop": Roda a cada 30 milissegundos para a barra ficar lisa (60FPS)
    studySession.timerId = setInterval(() => {
        
        // Descobre quanto tempo se passou de verdade
        const elapsed = Date.now() - studySession.timerStartTime;
        studySession.timeLeft = Math.max(0, studySession.maxTimeLimit - elapsed);
        
        // 📡 O RADAR: Procura a barra na tela. Se a tela recarregou, ele acha a barra nova!
        const bar = document.getElementById('survival-bar');
        if (bar) {
            const percent = (studySession.timeLeft / studySession.maxTimeLimit) * 100;
            bar.style.width = percent + '%'; // Corta a barra no tamanho certo na marra
            
            // Bônus visual imersivo
            if (percent < 25) bar.style.backgroundColor = 'var(--red)';
            else if (percent < 50) bar.style.backgroundColor = '#ffcc00';
            else bar.style.backgroundColor = 'var(--gold2)';
        }

        // 💥 O TEMPO ACABOU DE VERDADE
        if (studySession.timeLeft <= 0) {
            clearInterval(studySession.timerId); // Desliga o motor
            
            if (document.getElementById('survival-bar')) {
                toast('⏳ O tempo esgotou!', 'err');
                if (typeof playSfx === 'function') playSfx('fail');
                if (typeof rateCard === 'function') rateCard(0); // Punição aplicada!
            }
        }
    }, 30); 
}

// ✨ MOTOR DE RECONHECIMENTO DE VOZ
function startDictation(inputId, lang, btnElement) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    toast('Seu navegador não suporta microfone.', 'err');
    return;
  }
  
  const recognition = new SpeechRecognition();
  // Puxa a bandeirinha exata do cartão!
  recognition.lang = lang || 'pt-BR'; 
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  const oldText = btnElement.textContent;
  btnElement.textContent = '🔴'; // Fica vermelho para mostrar que está gravando
  
  recognition.start();

  recognition.onresult = function(event) {

// Remove os asteriscos para exibição visual
function clean(s) {

function esc(s) {

}

function escReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function modeLabel(m) {

  }[m]||m;
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i||j));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function updateStreak() {
  const t = new Date().toISOString().slice(0, 10);
  const last = new Date(STATS.lastStudy || 0).toISOString().slice(0,10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  
  if (last === t) return; // Já estudou hoje
  
  if (last === yesterday) {
      // Dia perfeito
      STATS.streak = (STATS.streak || 0) + 1;
  } else {
      // Perdeu um ou mais dias! Verifica se tem Escudo
      if (STATS.inventory && STATS.inventory.shields > 0) {
          STATS.inventory.shields--;

      }

}

function ouvirPalavra(texto, lang) {
  if (!texto) return;
  
  // 🧹 Essa linha é crucial! Ela cancela o áudio anterior para não travar o jogo
  window.speechSynthesis.cancel(); 
  
  // Limpamos os asteriscos para o robô não ler a palavra "asterisco" no meio da frase
  const textoLimpo = clean(texto);
  
  const u = new SpeechSynthesisUtterance(textoLimpo);
  // Se o idioma não for passado, ele usa pt-BR como escudo de segurança
  u.lang = lang || 'pt-BR'; 
  u.rate = 0.95; // Velocidade ligeiramente mais pausada para soar elegante
  
  window.speechSynthesis.speak(u);
}

// ✨ VARIÁVEIS GLOBAIS DE SEGURANÇA (Para o navegador não esquecer o relógio)
window.vozesMaoLivre = [];
window.leituraDebounce = null;

// ✨ MOTOR DO LEITOR MÃOS LIVRES (MÉTODO CLÁSSICO COM ANTI-ECO BLINDADO)
function lerTelaCompleta(tempoDoRelogio) {
    if (!configJogo.leituraCompleta || typeof studySession === 'undefined' || !studySession) return;
    
    const sess = studySession;
    
    const checkRespondido = () => sess.typeAnswered || sess.choiceAnswered || sess.tfAnswered || sess.revChoiceAnswered || sess.scrambleAnswered || sess.spellAnswered || sess.syntaxAnswered || sess.clozeAnswered || sess.contextAnswered || sess.imgChoiceAnswered || sess.bossAnswered || sess.blindAnswered || sess.flipped;
    
    if (checkRespondido()) return;

    // 🛡️ O MATA-FANTASMAS (Debounce): 
    // Se o seu código disparar essa função 2 vezes rápido, ele cancela a primeira e roda só a última!
    clearTimeout(window.leituraDebounce);

    window.leituraDebounce = setTimeout(() => {
        
        // 🔒 O CADEADO DA RODADA: Garante que não vai ter eco se a tela piscar
        if (sess.leituraLidaNoIndex === sess.current) return;

        const card = sess.queue[sess.current];
        let activeMode = sess.currentAdaptiveMode || (typeof studyMode !== 'undefined' ? studyMode : 'flash');

        // Cancela vozes antigas imediatamente
        window.speechSynthesis.cancel();
        
        // Esvazia a caixa para a nova rodada
        window.vozesMaoLivre = []; 

        function falar(texto, idioma) {
            if (!texto) return;
            const textoLimpo = typeof clean === 'function' ? clean(texto) : texto;
            const u = new SpeechSynthesisUtterance(textoLimpo);
            u.lang = idioma || 'pt-BR';
            u.rate = 0.95; 
            window.vozesMaoLivre.push(u); // Guarda na caixa global
        }

        const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
        const langPergunta = 'pt-BR'; 
        const langPalavra = card.langWord || 'pt-BR';
        const langDef = card.langDef || 'pt-BR';
        const langOpcoes = isRel ? langPalavra : langDef;

        // 🧠 ROTEIRO INTELIGENTE
        if (activeMode === 'choice') {
            const typeLbl = isRel ? `Selecione um ${card.cardType} para:` : 'Qual a definição de:';
            falar(typeLbl, langPergunta);
            falar(card.word, langPalavra);
            
            const letras = ['A', 'B', 'C', 'D', 'E', 'F'];
            if (sess.choices) {
                sess.choices.forEach((ch, i) => { 
                    falar(`Alternativa ${letras[i]}.`, langPergunta);
                    falar(ch, langOpcoes);
                });
            }
        }
        else if (activeMode === 'tf') {
            const typeText = isRel ? `Tem como ${card.cardType}:` : 'Significa:';
            falar(card.word, langPalavra);
            falar(typeText, langPergunta);
            falar(sess.tfDefinition, langOpcoes);
        }
        else if (activeMode === 'revchoice') {
            const promptTxt = isRel ? `Qual palavra possui este ${card.cardType}:` : 'Qual é a palavra para esta definição:';
            falar(promptTxt, langPergunta);
            falar(sess.revChoicePrompt, langOpcoes);
            
            const letras = ['A', 'B', 'C', 'D', 'E', 'F'];
            if (sess.revChoices) {
                sess.revChoices.forEach((ch, i) => { 
                    falar(`Alternativa ${letras[i]}.`, langPergunta);
                    falar(ch, langPalavra); 
                });
            }
        }
        else if (activeMode === 'type') {
             const promptTxt = isRel ? `Digite um ${card.cardType} para:` : 'Escreva a palavra para esta definição:';
             falar(promptTxt, langPergunta);
             falar(isRel ? card.word : card.definition, isRel ? langPalavra : langDef);
        }
        // ✨ NOVO: MODO DITADO CEGO (Sem revelar a resposta!)
        else if (activeMode === 'blind') {
             falar("Ditado Cego. Fale a palavra correspondente para este significado:", langPergunta);
             falar(card.definition, langDef);
        }
        // ✨ NOVO: MODO BOSS PROVA FINAL (Lê as exigências dinâmicas)
        else if (activeMode === 'boss') {
             let exigencias = ['a palavra'];
             if (card.synonyms) exigencias.push('um sinônimo');
             if (card.antonyms) exigencias.push('um antônimo');
             let textoExigencia = exigencias.join(', ').replace(/,([^,]*)$/, ' e$1'); 
             
             falar(`Prova Final. A escuridão exige o seu conhecimento. Ouça o significado e fale ${textoExigencia}:`, langPergunta);
             falar(card.definition, langDef);
        }
        // ✨ NOVO: MODO CONTEXTO / LACUNAS
        else if (activeMode === 'cloze') {
             let promptTxt = 'Preencha as lacunas na ordem:';
             if (sess.clozeIsRelList) {
                 promptTxt = `Selecione ${sess.clozeAnswers.length} ${card.cardType}s:`;
             } else if (isRel) {
                 promptTxt = `Preencha com um ${card.cardType}:`; 
             }
             
             // Lê a Situação primeiro (se existir)
             if (card.contextHint && !sess.clozeIsRelList) {
                 falar(`Situação: ${card.contextHint}`, langPergunta);
                 promptTxt = isRel ? `Complete a situação com um ${card.cardType}:` : 'Complete a frase para esta situação:';
             }
             
             falar(promptTxt, langPergunta);
             
             // Troca visual dos traços por uma palavra falada "lacuna"
            //  if (sess.clozeText) {
            //      let textoLido = sess.clozeText.replace(/___/g, "lacuna").replace(/&nbsp;•&nbsp;/g, " e ");
            //      falar(textoLido, langOpcoes);
            //  }
             
             // Lê as opções dos botões para o jogador
             if (sess.clozePool && sess.clozePool.length > 0) {
                 falar("As opções são:", langPergunta);
                 sess.clozePool.forEach((item) => {
                     falar(item.word, langOpcoes); // Opções na língua de estudo
                 });
             }
        }
        else {
             falar(card.word, langPalavra);// O Flashcard clássico continua lendo a palavra
        }

        // ⏱️ O MÉTODO CLÁSSICO QUE FUNCIONA (onend)
        if (window.vozesMaoLivre.length > 0) {
            
            // Avisa a ÚLTIMA frase para ligar o relógio assim que terminar
            window.vozesMaoLivre[window.vozesMaoLivre.length - 1].onend = () => {
                if (tempoDoRelogio && !checkRespondido()) {
                    startSurvivalTimer(tempoDoRelogio);
                }
            };
            
            // Tranca o cadeado SÓ AQUI, na hora exata que manda falar as cartas
            sess.leituraLidaNoIndex = sess.current;
            
            // Manda o robô falar toda a fila
            window.vozesMaoLivre.forEach(u => window.speechSynthesis.speak(u));
            
        } else if (tempoDoRelogio) {
            // Segurança: Se por algum motivo a carta for muda, liga o relógio direto
            startSurvivalTimer(tempoDoRelogio);
        }

    }, 150); // Fôlego de 150ms para juntar e eliminar chamadas fantasmas
}

function playQuestionAudio() {
  // 🛑 O ESCUDO ANTI-TIQUE: Se o Mãos Livres estiver ligado, proíbe o áudio normal de nascer!
  if (configJogo.leituraCompleta) return;
  if (!autoPlayAudio || !studySession) return;
  const card = studySession.queue[studySession.current];
  if (!card) return;
  
  const mode = studySession.currentAdaptiveMode || studyMode;
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';

  // 1. A MORDAÇA: Modos de adivinhação onde ele SÓ PODE LER A DEFINIÇÃO (Nunca a palavra!)
const modosDeAdivinhar = ['type', 'spell', 'scramble', 'context', 'syntax'];  
  if (!isRel && modosDeAdivinhar.includes(mode)) {
    // Usa o clean() para a voz nunca ler os *asteriscos* em voz alta
    ouvirPalavra(clean(card.definition), card.langDef || 'pt-BR');
  }
  // A Inversa sempre mostra a definição como dica
  else if (mode === 'revchoice') {
    ouvirPalavra(clean(studySession.revChoicePrompt || card.definition), card.langDef || 'pt-BR');
  }
  // 2. Modos onde ele deve ler a palavra (Flash, Lacunas...)
  else {
    ouvirPalavra(card.word, card.langWord || 'pt-BR');
  }
}

function playAnswerAudio() {
  if (!autoPlayAudio || !studySession) return;
  const card = studySession.queue[studySession.current];
  if (!card) return;
  
  const mode = studySession.currentAdaptiveMode || studyMode;
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';

  // 1. Modos de Frase: A resposta revelada é a frase/definição inteira
  if (mode === 'syntax') {
     const texto = isRel ? card.definition : (studySession.syntaxTarget || card.definition);
     ouvirPalavra(clean(texto), card.langDef || 'pt-BR');
     return;
  }
  if (mode === 'cloze') {
     ouvirPalavra(clean(card.definition), card.langDef || 'pt-BR');
     return;
  }

  // 2. Modos onde o Alvo era descobrir a PALAVRA ou um Sinônimo específico
  if (mode === 'type' || mode === 'spell' || mode === 'scramble' || mode === 'context' || mode === 'revchoice') {
     if (isRel && mode !== 'revchoice') {
        // Se acertou um sinônimo específico, lê ele. Senão lê a lista toda.
        if (mode === 'spell' && studySession.spellTarget) {
            ouvirPalavra(clean(studySession.spellTarget), card.langDef || 'pt-BR');
        } else if (mode === 'scramble' && studySession.scrambleTarget) {
            ouvirPalavra(clean(studySession.scrambleTarget), card.langDef || 'pt-BR');
        } else {
            ouvirPalavra(clean(card.definition), card.langDef || 'pt-BR');
        }
     } else {
        // Carta normal: lê a palavra que você acertou
        let resposta = card.word;
        if (mode === 'spell' && studySession.spellTarget) resposta = studySession.spellTarget;
        if (mode === 'scramble' && studySession.scrambleTarget) resposta = studySession.scrambleTarget;
        ouvirPalavra(clean(resposta), card.langWord || 'pt-BR');
     }
     return;
  }

  // 3. Modos Clássicos (Flash, Múltipla Escolha, V/F)
  // A pergunta foi a Palavra, então a resposta lida é a Definição
  ouvirPalavra(clean(card.definition), card.langDef || 'pt-BR');
}

// ✨ COMPRESSOR AUTOMÁTICO DE CÂMERA (Versão Ultra-Leve WEBP)
function resizeImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      
      // ✨ Reduzimos de 400 para 250. Fica nítido na tela, mas pesa 80% menos!
      const MAX = 250; 
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } 
      else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      
      // ✨ A GRANDE MÁGICA: Trocamos o 'image/jpeg' pesado por 'image/webp' levíssimo
      callback(canvas.toDataURL('image/webp', 0.6)); 
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
}

// ✨ PROCESSA O UPLOAD OU EMOJI NO FORMULÁRIO

function exportBackup() {
    // 1. Garante que os últimos dados (como o fogo do streak) estão atualizados antes de salvar
    if (typeof saveStats === 'function') saveStats();

    const data = { words: W, stats: STATS };
    const jsonStr = JSON.stringify(data);
    
    // ✨ A MÁGICA DO BLOB: Cria um arquivo virtual real na memória, sem limites de tamanho!
    const blob = new Blob([jsonStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    
    const dl = document.createElement('a');
    dl.setAttribute("href", url);
    
    // Cria um nome de arquivo automático com a data de hoje!
    const date = new Date().toISOString().slice(0,10);
    dl.setAttribute("download", `demostenes_backup_${date}.json`);
    
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
    
    // ✨ FAXINEIRO: Libera a memória do celular que o arquivo virtual usou
    URL.revokeObjectURL(url);
    
    toast('💾 Backup exportado com sucesso!', 'ok');
}

function importBackup(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if(data.words && data.stats) {
                // 1. Substitui a memória atual pela do arquivo
                W = data.words;
                STATS = data.stats;
                
                // ✨ Proteção extra para o seu Foguinho: 
                // Se o backup for antigo e não tiver o streak salvo, não deixa ficar 'undefined'
                if (typeof STATS.streak === 'undefined') STATS.streak = 0; 
                
                // 2. Salva o STATS no banco de dados
                if (typeof saveStats === 'function') saveStats();
                
                // Avisa o usuário que o processo começou
                toast('📦 Desempacotando dados, aguarde...', 'gold');
                
                // ✨ 3. O ANTÍDOTO CONTRA O TRAVAMENTO MOBILE (Salvamento em Lotes)
                let index = 0;
                const batchSize = 50; // Salva 50 cartas por vez para o celular respirar
                
                function saveNextBatch() {
                    const end = Math.min(index + batchSize, W.length);
                    
                    // Salva o lote atual
                    for(; index < end; index++) {
                        if (typeof saveCard === 'function') saveCard(W[index]);
                    }
                    
                    // Se ainda tem cartas para salvar, agenda o próximo lote
                    if (index < W.length) {
                        setTimeout(saveNextBatch, 30); // Pausa de 30ms para o IndexedDB não estourar
                    } else {
                        // 🎉 Terminou todas as cartas com segurança! Atualiza a tela.
                        toast('✨ Progresso restaurado com sucesso!', 'ok');
                        if (typeof closeModal === 'function') closeModal();
                        if (typeof updateHeader === 'function') updateHeader();
                        if (typeof updateWordList === 'function') updateWordList();
                        if (typeof render === 'function') render();
                    }
                }
                
                // Dispara o motor de salvamento seguro
                saveNextBatch(); 

            } else {
                toast('Arquivo incompatível ou corrompido.', 'err');
                if (typeof triggerScreenShake === 'function') triggerScreenShake();
            }
        } catch(err) {
            console.error(err);
            toast('Erro ao ler o arquivo!', 'err');
            if (typeof triggerScreenShake === 'function') triggerScreenShake();
        }
    };
    reader.readAsText(file);
}

    if (!STATS.achievements) {

            currentPrestige: 1, 
            list: []
        };
    }
    
    // BLINDAGEM EXTRA: Garante que "list" seja um array real antes do "find" rodar
    if (!Array.isArray(STATS.achievements.list)) {
        STATS.achievements.list = [];
    }

    // 3. ✨ A MÁGICA DE ATUALIZAÇÃO: Mescla a lista do jogador com a Lista Mestre!
    let updated = false;
    masterAchievementsList.forEach(masterQuest => {
        // Tenta achar essa conquista na lista salva do jogador
        const existingQuest = STATS.achievements.list.find(q => q.id === masterQuest.id);
        
        if (!existingQuest) {

            STATS.achievements.list.push({ ...masterQuest });

            }
        });
        
        STATS.achievements.currentPrestige = realPrestige;
        if (typeof saveStats === 'function') saveStats();
    }
}

// ✨ MOTOR DE PAGAMENTO DAS CONQUISTAS (Atualizado com Tickets do Coliseu)
function claimAchievement(index) {
    const q = STATS.achievements.list[index];
    if (q && q.progress >= q.target && !q.claimed) {
        q.claimed = true;
        
        // 1. Recebe o Ouro e o XP normais
        STATS.moedas = (STATS.moedas || 0) + q.rewardCoins;
        STATS.earnedXP = (STATS.earnedXP || 0) + q.rewardXP;
        
        // 🎟️ 2. RECEBE OS TICKETS (Se a conquista tiver essa recompensa)
        if (q.rewardTickets && q.rewardTickets > 0) {

// ✨ MOTOR UNIVERSAL DE PAGAMENTO (Agora suporta Tickets Variáveis e Épicos)
function claimQuest(index, type = 'daily') {
    const qList = type === 'weekly' ? STATS.weeklyQuests : STATS.quests;
    const q = qList[index];
    
    if (q && q.progress >= q.target && !q.claimed) {
        q.claimed = true;
        STATS.moedas = (STATS.moedas || 0) + q.rewardCoins;
        STATS.earnedXP = (STATS.earnedXP || 0) + q.rewardXP;
        
        // 🎟️ LÓGICA DE TICKETS: Verifica se dá Múltiplos Tickets (Semanais) ou 1 Ticket (Épica Diária)
        let ticketsGanhos = 0;
        if (q.rewardTickets && q.rewardTickets > 0) {
            ticketsGanhos = q.rewardTickets;
        } else if (q.isEpic) {
            ticketsGanhos = 1;
        }

        if (ticketsGanhos > 0) {
            if (!STATS.inventory) STATS.inventory = {};
            STATS.inventory.bossTickets = (STATS.inventory.bossTickets || 0) + ticketsGanhos;
            
            // Aviso com atraso de 1.5s para não ser engolido pelo Toast principal!
            setTimeout(() => {
                if (typeof toast === 'function') toast(`🎟️ Você ganhou +${ticketsGanhos} Ticket(s) do Coliseu!`, '#ff4444');
            }, 1500);
        }

        if (typeof saveStats === 'function') saveStats();
        if (typeof shootConfetti === 'function') shootConfetti();
        toast(`🎁 Recompensa ${type === 'weekly' ? 'Semanal' : 'Diária'} Resgatada!`, 'gold');
        
        const moedasEl = document.getElementById('hMoedas');
        if (moedasEl) moedasEl.textContent = STATS.moedas + '🪙';
        if (typeof updateHeader === 'function') updateHeader(); 
        
        // ✨ RASTREADOR DA CONQUISTA: Herói de Atena (Conta +1 ao resgatar qualquer missão)
        if (STATS.achievements && STATS.achievements.list) {
            const achHero = STATS.achievements.list.find(a => a.id === 'ach_quests');
            if (achHero && achHero.progress < achHero.target) {
                achHero.progress += 1;

            }
        }
        
        if (typeof saveStats === 'function') saveStats();
        openQuestsModal(); 
    }
}

// ✨ SISTEMA LIVE-OPS: EVENTOS POR TURNO E MARATONAS
function runEventManager() {
    if (!STATS) return;
    const now = Date.now();
    const dateObj = new Date();
    const hour = dateObj.getHours();
    const dayOfWeek = dateObj.getDay(); 
    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
    const todayStr = dateObj.toLocaleDateString();

    let currentSlot = isWeekend ? "MARATHON" : (hour < 12 ? "TURNO_1" : "TURNO_2");

    if (STATS.activeEvent && now > STATS.activeEvent.endTime) {
        if (!isWeekend) toast(`⏳ O evento ${STATS.activeEvent.name} terminou!`, 'stone');
        
        STATS.activeEvent = null;
        if (typeof saveStats === 'function') saveStats();
    }

    if (STATS.activeEvent) return;

    if (!isWeekend && STATS.lastEventRoll === todayStr && STATS.lastEventSlot === currentSlot) {
        return;
    }

    const roll = Math.random(); 
    let eventTriggered = null;

    // ✨ LISTA ÉPICA (As caixas de 1 e 2 minutos + Crit e Ouro)
    const epics = [
        { id: 'coins_triple', name: 'Chuva de Ouro 💰', desc: 'Moedas TRIPLAS!', color: 'var(--gold)', icon: '💰' },
        { id: 'xp_triple', name: 'Sabedoria de Atena 🦉', desc: 'XP TRIPLO!', color: '#e024ff', icon: '🦉' },
        { id: 'ev_crit', name: 'Fúria Crítica 🎲', desc: 'Críticos +35%', color: '#ff8c00', icon: '🎲' },
        { id: 'ev_box_pandora', name: 'Grande Surpresa 💎', desc: 'Caixa de Pandora (2 min)', color: '#00f5ff', icon: '💎' },
        { id: 'ev_box_olimpo', name: 'Mega Prêmio 👑', desc: 'Baú do Olimpo (1 min)', color: '#ffd700', icon: '👑' }
    ];
    
    // ✨ LISTA RARA (A caixa de 3 min + Pets)
    const rares = [
        { id: 'coins_double', name: 'Benção de Hermes 🪙', desc: 'Moedas DUPLAS!', color: 'var(--green)', icon: '🪙' },
        { id: 'xp_double', name: 'Foco de Apolo ☀️', desc: 'XP DUPLO!', color: '#ff245e', icon: '☀️' },
        { id: 'lives_inf', name: 'Imortalidade ❤️‍🔥', desc: 'Sem gastar Vidas!', color: 'var(--red)', icon: '❤️‍🔥' },
        { id: 'shields_inf', name: 'Égide Divina 🛡️', desc: 'Sem punição no SM-2!', color: 'var(--blue)', icon: '🛡️' },
        { id: 'ev_pet_aff', name: 'Festa dos Pets 🐜', desc: 'Afinidade x3', color: '#ffaa00', icon: '🐜' },
        { id: 'ev_box_bronze', name: 'Surpresinha 🎁', desc: 'Ânfora de Bronze (3 min)', color: '#cd7f32', icon: '🎁' },
        { id: 'ev_pet_fed', name: 'Barriga Cheia 🍎', desc: 'Aura Ativa: Pets sempre com bônus e não gastam ração!', color: '#ff3333', icon: '🍎' }
    ];

    if (roll < 0.15) {
        eventTriggered = epics[Math.floor(Math.random() * epics.length)];
    } else {
        eventTriggered = rares[Math.floor(Math.random() * rares.length)];
    }

    if (eventTriggered) {
        STATS.lastEventRoll = todayStr;
        STATS.lastEventSlot = currentSlot;

        // ✨ TEMPO DINÂMICO
        let durationMs = 3600000; // 1 Hora padrão
        if (eventTriggered.id === 'ev_box_bronze') durationMs = 3 * 60 * 1000; // 3 min
        if (eventTriggered.id === 'ev_box_pandora') durationMs = 2 * 60 * 1000; // 2 min
        if (eventTriggered.id === 'ev_box_olimpo') durationMs = 1 * 60 * 1000; // 1 min

        STATS.activeEvent = {
            ...eventTriggered,
            endTime: now + durationMs 
        };
        
        const prefix = isWeekend ? "🎉 MARATONA ATIVA" : (currentSlot === "TURNO_1" ? "🌅 EVENTO DA MANHÃ" : "🌆 EVENTO DA TARDE");
        toast(`${prefix}: ${eventTriggered.name}!`, 'gold');
        
        if (typeof saveStats === 'function') saveStats();
    }
}

// ✨ SINTETIZADOR RETRÔ DE ÁUDIO PARA O GACHA
function playGachaSound(soundType) {
    // Verifica se o áudio do jogo está ativado/disponível
    if (typeof audioCtx === 'undefined' || !audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // Função interna para tocar uma nota musical rápida
    function playNote(freq, typeOsc, startTime, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = typeOsc;
        osc.frequency.setValueAtTime(freq, startTime);
        
        // Efeito de "fade out" no som para não estourar o ouvido
        gain.gain.setValueAtTime(0.1, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    const now = audioCtx.currentTime;

    if (soundType === 'win') {
        // 🌟 SOM DE VITÓRIA: Notas subindo felizes
        playNote(440.00, 'sine', now, 0.1);       // Lá
        playNote(554.37, 'sine', now + 0.1, 0.1); // Dó sustenido
        playNote(659.25, 'sine', now + 0.2, 0.3); // Mi (Longo)
    } 
    else if (soundType === 'jackpot') {
        // 🎰 SOM DE JACKPOT SUPREMO: Fanfarra Épica
        playNote(523.25, 'square', now, 0.1);       // Dó
        playNote(659.25, 'square', now + 0.1, 0.1); // Mi
        playNote(783.99, 'square', now + 0.2, 0.1); // Sol
        playNote(1046.50, 'square', now + 0.3, 0.4); // Dó Agudo (Forte)
        // Adiciona um grave junto para dar impacto
        playNote(261.63, 'sine', now + 0.3, 0.4); 
    } 
    else if (soundType === 'loss') {
        // 🌩️ SOM DE DERROTA: Notas descendo tristes
        playNote(300, 'sawtooth', now, 0.2);
        playNote(250, 'sawtooth', now + 0.2, 0.2);
        playNote(200, 'sawtooth', now + 0.4, 0.4);
    }
}

// ✨ A MÁQUINA DA SORTE (BALANÇEAMENTO JUSTO E SEM BUGS)
function playGacha() {
    if (!STATS.inventory) STATS.inventory = {};
    if (!STATS.pets) STATS.pets = {};
    
    // 🛡️ CORREÇÃO DA MEMÓRIA: Tira o Math.max que estava agindo como "Agiota"!
    let memoriaPacto = localStorage.getItem('config_sacrificioGacha');
    let sacrificio = 0;
    
    if (memoriaPacto !== null && memoriaPacto !== '') {
        sacrificio = parseInt(memoriaPacto);
    } else if (typeof configJogo !== 'undefined' && configJogo.sacrificioGacha !== undefined) {
        sacrificio = parseInt(configJogo.sacrificioGacha);
    }

    // 💸 O TRIBUTO BALANCEADO (100% = 10 Ouro e 50 XP)
    let custoOuro = 0;
    let custoXP = 0;

    if (sacrificio > 0) {
        custoOuro = Math.floor(sacrificio * 0.10); // A cada 10%, cobra 1 Ouro
        custoXP = Math.floor(sacrificio * 0.50);   // A cada 2%, cobra 1 XP
        
        // Só debita se realmente tiver custo
        if (custoOuro > 0) STATS.moedas = Math.max(0, (STATS.moedas || 0) - custoOuro);
        
        if (custoXP > 0) {
            if (!STATS.earnedXP) STATS.earnedXP = 0;
            STATS.earnedXP = Math.max(0, STATS.earnedXP - custoXP);
        }
        
        // Atualiza a barrinha de moedas na tela
        const moedasEl = document.getElementById('hMoedas');
        if (moedasEl) moedasEl.textContent = STATS.moedas + '🪙';
    }

// 🐾 BÔNUS DOS MASCOTES (DROP RATE NO GACHA)
    let bonusPetDrop = 0;
    if (STATS.pets && STATS.pets.active) {
        let petAtivo = STATS.pets.active;
        if (petAtivo === 'raposa' || petAtivo === 'grifo') {
            let affinity = STATS.pets.affinity[petAtivo] || 0;
            let lvlPet = Math.floor(affinity / 50) + 1;
            // Caso exista uma função que crave o nível máximo do pet, usamos ela
            if (typeof getPetCappedLevel === 'function') lvlPet = getPetCappedLevel(petAtivo);
            
            // O Gacha não consome a comida, ele só checa se o pet está de barriga cheia!
            let isFedPet = (STATS.pets.fedCharges > 0 || (STATS.activeEvent && STATS.activeEvent.id === 'ev_pet_fed'));
            
            if (petAtivo === 'raposa') {
                // Raposa: Foco em Gacha
                bonusPetDrop = isFedPet ? (0.05 + ((lvlPet - 1) * 0.01)) : (0.02 + ((lvlPet - 1) * 0.005));
            } else if (petAtivo === 'grifo') {
                // Grifo: Híbrido
                bonusPetDrop = isFedPet ? (0.03 + ((lvlPet - 1) * 0.005)) : (0.01 + ((lvlPet - 1) * 0.002));
            }
        }
    }

    // 🎲 CÁLCULO DA SORTE (Agora somado com o Mascote!)
    let baseWinChance = 0.50; // Base: 50%
    let bonusChance = sacrificio / 200; 
    let finalWinChance = baseWinChance + bonusChance + bonusPetDrop;
    
    // ✨ MARTELO DOS DEUSES
    const win = (finalWinChance >= 1.0) ? true : (Math.random() <= finalWinChance); 
    
    // 🏆 PISCINA DE PRÊMIOS
    const winPool = [
        { id: 'magicHints', name: 'Dica de Atena ✨', weight: 25, qty: 1, type: 'inv', color: 'var(--gold2)' },

// 📊 FUNÇÃO MÁGICA ESPELHO: Calcula exatamente o que a playSfx vai dar!
window.atualizarEstimativa = function() {
    // 1. Descobre em qual modo o jogador está AGORA
    let isFreeMode = false;
    let isFlashcard = false;
    let isModoSmart = true;
    let timerAtivo = (typeof enableTimer !== 'undefined') ? enableTimer : true;

    // Se o jogo estiver rodando, pega as variáveis reais da partida!
    if (typeof studySession !== 'undefined' && studySession) {
        isFreeMode = studySession.isFreeMode;
        let activeModoJogo = studySession.currentAdaptiveMode || (typeof studyMode !== 'undefined' ? studyMode : '');
        isFlashcard = (activeModoJogo === 'flash');
        isModoSmart = (typeof studyMode !== 'undefined' && studyMode === 'adaptive' && !isFreeMode);
    } else if (typeof studyMode !== 'undefined') {
        // Tenta adivinhar caso a tela de config seja aberta no menu inicial
        isFreeMode = (studyMode === 'free');
        isModoSmart = (studyMode === 'adaptive');
    }

    // 2. Recompensas Base Iniciais
    let baseMoedas = isFreeMode ? 1 : 3; 
    let baseXP = isFreeMode ? 5 : 15; 

    // Penalidade se o relógio estiver desligado globalmente
    if (!timerAtivo) {
        baseMoedas = isFreeMode ? 0 : 1; 
        baseXP = isFreeMode ? 2 : 5;     
    } else {
        // ✨ NOVO: Adiciona a "Média" de velocidade do jogador! (Simula um acerto razoável de 1.5x)
        baseMoedas = Math.floor(baseMoedas * 1.5);
        baseXP = Math.floor(baseXP * 1.5);
    }

    // 3. O Grande Incentivo do Modo Smart e Punição do Flashcard
    if (isModoSmart) {
        if (isFlashcard) {
            baseMoedas = 2;
            baseXP = 10;
        } else {
            baseMoedas *= 2;
            baseXP *= 2;
        }
    } else if (isFlashcard) {
        // Flashcard no treino livre dá ZERO base!
        baseMoedas = 0;
        baseXP = 0;
    }

    let ganhoMoedas = baseMoedas;
    let ganhoXP = baseXP;

    // 4. A partir daqui, simulamos a carteira do STATS
    if (typeof STATS !== 'undefined') {
        
        // Eventos Live-Ops
        if (STATS.activeEvent && STATS.activeEvent.id === 'coins_double') ganhoMoedas *= 2;
        if (STATS.activeEvent && STATS.activeEvent.id === 'coins_triple') ganhoMoedas *= 3;
        if (STATS.activeEvent && STATS.activeEvent.id === 'xp_double') ganhoXP *= 2;
        if (STATS.activeEvent && STATS.activeEvent.id === 'xp_triple') ganhoXP *= 3;

        // Inventário / Néctar e Água
        if (STATS.inventory && STATS.inventory.doubleCoins > 0) ganhoMoedas *= 2;
        if (STATS.inventory && STATS.inventory.doubleXp > 0) ganhoXP *= 2;

        // Bônus dos Mascotes Equipados
        if (STATS.pets && STATS.pets.active) {
            let petAtivo = STATS.pets.active;
            const hasFreeFood = STATS.activeEvent && STATS.activeEvent.id === 'ev_pet_fed';
            
            // Mascotes não comem e não dão poder total no Treino Livre!
            const isFed = (STATS.pets.fedCharges > 0 || hasFreeFood) && !isFreeMode; 
            
            let petLevel = 1;
            if (typeof getPetCappedLevel === 'function') petLevel = getPetCappedLevel(petAtivo);

            if (petAtivo === 'coruja') { 
                ganhoXP += isFed ? (10 + ((petLevel - 1) * 2)) : (2 + Math.floor((petLevel - 1) * 0.5)); 
            } else if (petAtivo === 'fenix') { 
                ganhoMoedas += isFed ? (4 + (petLevel - 1)) : (1 + Math.floor((petLevel - 1) * 0.2)); 
            } else if (petAtivo === 'tartaruga') { 
                ganhoXP += isFed ? (4 + (petLevel - 1)) : (1 + Math.floor((petLevel - 1) * 0.2)); 
            } else if (petAtivo === 'formiga') { 
                ganhoMoedas += isFed ? (2 + Math.floor((petLevel - 1) * 0.5)) : 0; 
            } else if (petAtivo === 'aguia') { 
                ganhoMoedas += isFed ? 3 : 1; ganhoXP += isFed ? 10 : 3;
            } else if (petAtivo === 'dragao') { 
                ganhoMoedas += isFed ? (10 + ((petLevel - 1) * 2)) : (3 + Math.floor((petLevel - 1) * 0.5));
                ganhoXP += isFed ? (30 + ((petLevel - 1) * 5)) : (5 + (petLevel - 1));
            } else if (petAtivo === 'raposa') { 
                ganhoMoedas += isFed ? 2 : 0; ganhoXP += isFed ? 5 : 2;
            } else if (petAtivo === 'grifo') { 
                ganhoMoedas += isFed ? (5 + (petLevel - 1)) : 2; ganhoXP += isFed ? (15 + ((petLevel - 1) * 2)) : 5;
            }
        }
    }

    // 👹 5. Punições dos Hacks
    let multiplicadorPunicao = 1.0;
    let confFocoXP = (typeof configJogo !== 'undefined' && configJogo.focoXP) ? configJogo.focoXP : 0;
    let confFocoOuro = (typeof configJogo !== 'undefined' && configJogo.focoOuro) ? configJogo.focoOuro : 0;
    let confGacha = (typeof configJogo !== 'undefined' && configJogo.sacrificioGacha) ? configJogo.sacrificioGacha : 0;

    if (typeof configJogo !== 'undefined') {
        if (configJogo.dicasInfinitas) multiplicadorPunicao -= 0.50;
        if (configJogo.pularInfinito) multiplicadorPunicao -= 0.40; 
        if (configJogo.vidasInfinitas) multiplicadorPunicao -= 0.30; 
        if (configJogo.escudosInfinitos) multiplicadorPunicao -= 0.20; 
        if (configJogo.criticoCustom > 0) multiplicadorPunicao -= (configJogo.criticoCustom / 100);
    }
    
    if (multiplicadorPunicao < 0.1) multiplicadorPunicao = 0.1;

    if (multiplicadorPunicao < 1.0) {
        ganhoMoedas = Math.floor(ganhoMoedas * multiplicadorPunicao);
        ganhoXP = Math.floor(ganhoXP * multiplicadorPunicao);
    }

    // ⚖️ 6. A Balança do Modo Deus
    if (confFocoXP > 0) {
        ganhoXP = Math.floor(ganhoXP * (1 + (confFocoXP / 100)));
        ganhoMoedas = Math.floor(ganhoMoedas * (1 - (confFocoXP / 100)));
    } else if (confFocoOuro > 0) {
        ganhoMoedas = Math.floor(ganhoMoedas * (1 + (confFocoOuro / 100)));
        ganhoXP = Math.floor(ganhoXP * (1 - (confFocoOuro / 100)));
    }

    // 🎲 7. Pacto do Gacha
    if (confGacha > 0) {
        let reducaoGacha = 1 - (confGacha / 100);
        ganhoMoedas = Math.floor(ganhoMoedas * reducaoGacha);
        ganhoXP = Math.floor(ganhoXP * reducaoGacha);
    }

    // 8. Atualiza os números na tela
    let elM = document.getElementById('estMoedas');
    let elX = document.getElementById('estXP');
    if(elM) elM.innerText = ganhoMoedas + ' 🪙';
    if(elX) elX.innerText = ganhoXP + ' ✨';

    // 9. ✨ O CONSERTO DO NOME: Lê exatamente onde o jogador está!
    let elModo = document.getElementById('estModoNome');
    if(elModo) {
        let nomeModo = '';
        if (typeof studySession !== 'undefined' && studySession) {
            nomeModo = isModoSmart ? (isFlashcard ? 'Modo Smart (Flashcard)' : 'Modo Smart (Questão)') : (isFlashcard ? 'Treino Livre (Flashcard)' : 'Treino Livre (Questão)');
        } else {
            nomeModo = isModoSmart ? 'Modo Smart (Pré-Jogo)' : 'Modo Livre (Pré-Jogo)';
        }
        
        let notaTempo = timerAtivo ? ' ⚡' : ''; // Avisa se o bônus de relógio está sendo calculado
        elModo.innerText = '📊 Estimativa: ' + nomeModo + notaTempo;
    }
};

// 🎮 FUNÇÕES DOS BOTÕES [+] e [-] COM SALVAMENTO INSTANTÂNEO
window.changeFoco = function(tipo, val) {
    if (!configJogo.focoXP) configJogo.focoXP = 0;
    if (!configJogo.focoOuro) configJogo.focoOuro = 0;

    if (tipo === 'xp') {
        configJogo.focoXP = Math.max(0, Math.min(100, configJogo.focoXP + val));
        configJogo.focoOuro = 0; 
    } else {
        configJogo.focoOuro = Math.max(0, Math.min(100, configJogo.focoOuro + val));
        configJogo.focoXP = 0; 
    }
    
    // ✨ Salva no HD na hora!
    localStorage.setItem('config_focoXP', configJogo.focoXP);
    localStorage.setItem('config_focoOuro', configJogo.focoOuro);

    document.getElementById('focoXpVal').innerText = configJogo.focoXP + '%';
    document.getElementById('focoOuroVal').innerText = configJogo.focoOuro + '%';
    document.getElementById('descFocoXp').innerText = `+${configJogo.focoXP}% XP / -${configJogo.focoXP}% Ouro`;
    document.getElementById('descFocoOuro').innerText = `+${configJogo.focoOuro}% Ouro / -${configJogo.focoOuro}% XP`;
    atualizarEstimativa();
};

window.changeCritHack = function(val) {
    if (!configJogo.criticoCustom) configJogo.criticoCustom = 0;
    
    // Calcula o novo valor (travando entre 0 e 100)
    configJogo.criticoCustom = Math.max(0, Math.min(100, configJogo.criticoCustom + val));
    
    // ✨ A MÁGICA ACONTECE AQUI: Salva no HD na hora que você clica!
    localStorage.setItem('config_criticoCustom', configJogo.criticoCustom);
    
    // Atualiza os textos na tela
    document.getElementById('critHackValue').innerText = configJogo.criticoCustom + '%';
    document.getElementById('critHackPen').innerText = configJogo.criticoCustom > 0 ? `Penalidade: -${configJogo.criticoCustom}% Ouro e XP` : 'Sem penalidade extra';
    
    // Recalcula a estimativa do topo
    if (typeof atualizarEstimativa === 'function') atualizarEstimativa();
};

window.changePacto = function(val) {
    if (!configJogo.sacrificioGacha) configJogo.sacrificioGacha = 0;
    configJogo.sacrificioGacha = Math.max(0, Math.min(100, configJogo.sacrificioGacha + val));
    localStorage.setItem('config_sacrificioGacha', configJogo.sacrificioGacha);
    
    document.getElementById('pactoVal').innerText = configJogo.sacrificioGacha + '%';
    atualizarEstimativa();
};

function fecharConfig() {

// ✨ FUNÇÃO QUE CONTROLA O + E O -
function changeCritHack(amount) {
    let val = (configJogo.criticoCustom || 0) + amount;
    if (val < 0) val = 0; // Não deixa ser menor que zero
    if (val > 100) val = 100; // Não deixa ser maior que 100%
    
    configJogo.criticoCustom = val;
    localStorage.setItem('config_criticoCustom', val);

    // Atualiza os números na tela na mesma hora
    const span = document.getElementById('critHackValue');
    const pen = document.getElementById('critHackPen');
    if (span) span.innerText = val + '%';
    if (pen) pen.innerText = val > 0 ? `Penalidade: -${val}% Ouro e XP` : `Sem penalidade extra`;
}

// ✨ A FORNALHA DA ALQUIMIA (Transmutação Direta)
function realizarTransmutacao() {
    let amount = parseInt(document.getElementById('transmuteAmount').value);
    let type = document.getElementById('transmuteType').value;
    
    if (isNaN(amount) || amount <= 0) return toast('Digite um valor válido!', 'err');
    
    if (type === 'xp_to_gold') {
        if (!STATS.earnedXP || STATS.earnedXP < amount) return toast('Você não tem todo esse XP para queimar!', 'err');
        
        let ganhoOuro = Math.floor(amount / 5); // A cada 5 XP queimados, ganha 1 Moeda
        if (ganhoOuro < 1) return toast('Mínimo para criar ouro é 5 XP!', 'err');

        STATS.earnedXP -= amount;
        STATS.moedas += ganhoOuro;
        toast(`Alquimia: -${amount} XP ➔ +${ganhoOuro} 🪙`, 'gold');
        
    } else if (type === 'gold_to_xp') {
        if (!STATS.moedas || STATS.moedas < amount) return toast('Você não tem todo esse Ouro para queimar!', 'err');
        
        let ganhoXP = amount * 5; // A cada 1 Moeda queimada, ganha 5 XP
        
        STATS.moedas -= amount;
        STATS.earnedXP += ganhoXP;
        toast(`Alquimia: -${amount} 🪙 ➔ +${ganhoXP} XP`, '#00e5ff');
    }
    
    if (typeof saveStats === 'function') saveStats();
    
    // Atualiza a tela de trás (para mostrar o nível caindo ou subindo) e reabre o modal para atualizar os saldos
    if (typeof render === 'function') render(); 
    abrirConfig(); 
}

// ✨ O MODAL DE EVOLUÇÃO (LIMIT BREAK) DOS PETS
function openPetEvolutionModal(petId, petName) {
    if (!STATS.pets.evoLevel) STATS.pets.evoLevel = {};
    const evoAtual = STATS.pets.evoLevel[petId] || 0;
    
    // A MATEMÁTICA DA DOR (Fica mais caro a cada evolução)
    const custoMoedas = 15000 * (evoAtual + 1);
    const custoCristal = 1 * (evoAtual + 1);
    
    const hasMoedas = STATS.moedas >= custoMoedas;
    const hasCristal = STATS.inventory.petCrystals >= custoCristal;
    const canEvolve = hasMoedas && hasCristal;

    let html = `
    <h3 style="color:var(--red); text-transform:uppercase; font-weight:bold; text-shadow:0 0 10px rgba(255,0,0,0.4)">🔥 Quebra de Limites</h3>

    <div style="background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; padding:15px; margin-bottom:15px">

        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px">
            <span>🪙 Moedas Exigidas:</span>
            <span style="color:${hasMoedas ? 'var(--green)' : 'var(--red)'}; font-weight:bold">${STATS.moedas.toLocaleString()} / ${custoMoedas.toLocaleString()}</span>
        </div>
        
        <div style="display:flex; justify-content:space-between; font-size:13px">
            <span>💎 Cristais de Quíron:</span>
            <span style="color:${hasCristal ? 'var(--green)' : 'var(--red)'}; font-weight:bold">${(STATS.inventory.petCrystals || 0)} / ${custoCristal}</span>

      const escudoDisabled = (!escudosHacked && inv.miniShields <= 0 && !sess.miniShieldActive) ? 'disabled style="opacity:0.3"' : '';
      const pularLabel = pularHacked ? '⏭️ Pular (∞)' : `⏭️ Pular (${inv.skips || 0})`;
      const pularDisabled = (!pularHacked && inv.skips <= 0) ? 'disabled style="opacity:0.3"' : '';
      
      toolsHtml = `
      <div style="display:flex; gap:6px; justify-content:center; margin-bottom:12px; margin-top:4px; flex-wrap:wrap">
         ${canHint ? `
         <button id="btnMagicHint" class="btn ghost sm" onclick="useMagicHint()" ${dicaDisabled} style="border-color:${dicasHacked ? 'var(--red)' : 'var(--gold2)'}; color:${dicasHacked ? 'var(--red)' : 'var(--gold2)'}; flex:1; padding:6px 2px; font-size:11px">
             ${dicaLabel}
         </button>` : ''}
         <button id="btnMiniShield" class="btn ghost sm" onclick="useMiniShield()" ${escudoDisabled} style="border-color:${escudosHacked ? 'var(--red)' : 'var(--stone)'}; color:${escudosHacked ? 'var(--red)' : 'var(--stone)'}; flex:1; padding:6px 2px; font-size:11px">
             ${escudoLabel}
         </button>
          <button class="btn ghost sm" onclick="useSkipItem()" ${pularDisabled} style="border-color:${pularHacked ? 'var(--red)' : 'var(--green)'}; color:${pularHacked ? 'var(--red)' : 'var(--green)'}; flex:1; padding:6px 2px; font-size:11px">
             ${pularLabel}
          </button>
      </div>`;
  }

  const rarity = getCardRarity(card); 

  // ✨ O PAINEL DE SANGUE: Desenha a interface do Chefão se for o turno dele
  let bossUiHtml = '';
  if (sess.bossCardIndex === sess.current) {
      sess.bossActive = true;
      // Constrói os corações vermelhos, azuis e pretos (vidas perdidas)
      const bossHearts = '❤️'.repeat(sess.bossHp) + '🖤'.repeat(sess.bossMaxHp - sess.bossHp);
      const playerHearts = '💙'.repeat(sess.playerHp) + '🖤'.repeat(sess.playerMaxHp - sess.playerHp);

      bossUiHtml = `
      <div style="background: linear-gradient(135deg, #2a0000, #4d0000); border: 2px solid #ff4444; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); position: relative; overflow: hidden;">
          <div style="position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,0,0,0.1) 0%, transparent 60%); animation: spin 10s linear infinite;"></div>
          <div style="position: relative; z-index: 1;">
              <div style="font-size: 20px; font-weight: 900; color: #ff6b6b; letter-spacing: 3px; text-transform: uppercase; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-family: 'Cinzel', serif;">⚔️ Monstro Selvagem ⚔️</div>
              <div style="font-size: 12px; color: var(--stone2); font-style: italic; margin-bottom: 12px;">Derrote a palavra para abrir o Baú do Coliseu!</div>
              <div style="display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,0,0,0.3);">
                  <div style="text-align:center">
                      <div style="font-size:10px; color:#ff6b6b; font-weight:bold; letter-spacing:1px; margin-bottom:4px">HP MONSTRO</div>
                      <div style="font-size:16px; letter-spacing: 2px;">${bossHearts}</div>
                  </div>
                  <div style="font-size:24px; text-shadow: 0 0 10px #ff0000;">🆚</div>
                  <div style="text-align:center">
                      <div style="font-size:10px; color:#4dabf7; font-weight:bold; letter-spacing:1px; margin-bottom:4px">A SUA VIDA</div>
                      <div style="font-size:16px; letter-spacing: 2px;">${playerHearts}</div>
                  </div>
              </div>
          </div>
      </div>
      <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>`;
  } else {
      sess.bossActive = false;
  }

  // ✨ A aura sangrenta da carta: se for o Boss, a carta fica escura e com borda vermelha!
  const cardBossStyle = sess.bossActive ? 'border: 2px solid #ff4444; box-shadow: inset 0 0 30px rgba(255,0,0,0.2); background: rgba(40,0,0,0.3);' : '';

  return `

      <div style="display:flex;gap:8px;align-items:center">

    ${card.isLeech && !sess.bossActive ? `<div style="background:rgba(231,76,60,0.1); border:1px solid var(--red); color:var(--red); padding:6px; border-radius:var(--r); font-size:12px; margin-bottom:10px; text-align:center;"><b>🩸 Sanguessuga:</b> Você tem errado muito esta palavra. Cuidado!</div>` : ''}

    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    
    ${timerHtml}
    ${toolsHtml} 
    
    <!-- ✨ A CARTA EM SI (Pode ter Aura Vermelha) -->
    <div class="physical-card ${rarity.cls}" style="${cardBossStyle}">
       ${inner}
       
       ${(sess.hintUsed || sess.magicHintVisible) && !isAns ? `
       <div style="padding:12px; background:rgba(212,175,55,0.08); border:1px dashed var(--gold); color:var(--gold2); border-radius:var(--r); text-align:center; margin-top:14px; font-size:14px; font-weight:bold;">
          ${sess.magicHintVisible ? '✨ Dica de Atena:' : '💡 Dica Padrão:'} <span style="color:var(--gold)">${esc(sess.hintText)}</span>
       </div>` : ''}
    </div>

    <div style="display:flex;gap:8px;justify-content:center;margin-top:6px">
      <span style="font-size:11px;color:var(--stone);font-style:italic">Acertos: ${sess.correct} | Modo: ${modeLabel(activeMode)} ${studyMode === 'adaptive' ? '🧠' : (studyMode === 'custom' ? '🎛️' : '')}</span>

}

function buildFlashMode(card, intervals) {
  const flipped = studySession.flipped;
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
  const typeLbl = isRel ? hl(card.cardType) : 'PALAVRA';
  
  const lw = card.langWord || 'pt-BR';
  const ld = card.langDef || 'pt-BR';
  const lex = card.langEx || lw; 

  return `
    <div id="flashcard-wrap" onclick="flipCard()">
      <div class="flashcard${flipped ? ' flipped' : ''}" id="flashcard">
        <div class="fc-face front">
          <div class="fc-type">${typeLbl}</div>
          ${renderVisual(card)} 
          
          <!-- ✨ SEGREDO DO SILÊNCIO: Se desligado, remove o botão 🔊 e exibe só o texto limpo -->
          ${autoPlayAudio 
             ? `<button class="mini-btn" style="border:none; padding:4px 12px; margin-bottom:8px" onclick="event.stopPropagation(); ouvirPalavra('${esc(card.word)}', '${lw}')">🔊 ${esc(card.word)}</button>` 
             : `<div style="font-size:24px; font-weight:bold; color:var(--gold2); margin-bottom:8px">${esc(card.word)}</div>`}
          
          ${card.phonetic ? `<div class="fc-phonetic">[${esc(card.phonetic)}]</div>` : ''}
          ${card.wordClass ? `<div class="fc-class">${esc(card.wordClass)}</div>` : ''}
          ${card.category !== 'geral' ? `<span class="badge learning" style="margin-top:8px">${esc(card.category)}</span>` : ''}
          <div class="fc-hint">Toque para revelar</div>
        </div>
        <div class="fc-face back">
          
          ${autoPlayAudio 
             ? `<button class="mini-btn" style="border:none" onclick="event.stopPropagation(); ouvirPalavra('${esc(card.word)}', '${lw}')">🔊 ${esc(card.word)}</button>`
             : `<div style="font-size:24px; font-weight:bold; color:var(--gold2)">${esc(card.word)}</div>`}
          
          <div class="fc-type" style="margin-top:12px">${isRel ? 'RESULTADOS' : 'DEFINIÇÃO'}</div>
          <div class="fc-definition" style="display:flex; align-items:center; justify-content:center; gap:8px">
            ${autoPlayAudio ? `<button class="btn ghost sm" style="border:none; padding:4px; font-size:18px" onclick="event.stopPropagation(); ouvirPalavra('${esc(clean(card.definition))}', '${ld}')" title="Ouvir Definição">🔊</button>` : ''}
            <span>${esc(clean(card.definition))}</span>
          </div>
          
          ${card.example ? `
          <div class="fc-example" style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px">
            ${autoPlayAudio ? `<button class="btn ghost sm" style="border:none; padding:4px; font-size:16px" onclick="event.stopPropagation(); ouvirPalavra('${esc(clean(card.example))}', '${lex}')" title="Ouvir Exemplo">🔊</button>` : ''}
            <span>"${esc(clean(card.example))}"</span>
          </div>` : ''}
          
          ${card.synonyms ? `<div class="fc-synonym">≈ ${esc(card.synonyms)}</div>` : ''}
        </div>
      </div>
    </div>
    ${flipped ? `
    <div class="rating-row" style="margin-top:14px">
      <!-- ✨ MÁGICA AQUI: Chama o playSfx ANTES de rateCard, para garantir que o prêmio seja entregue! -->
      ${[0,1,2,3].map(q => `<button class="rating-btn r${q+1}" onclick="playSfx(${q} === 0 ? 'fail' : 'ok'); rateCard(${q})">
        <span class="rating-lbl">${q===0?'De novo':q===1?'Difícil':q===2?'Bom':'Fácil'}</span>
        <span class="rating-days">${q===0?'1d':intervals[q]+'d'}</span>
      </button>`).join('')}
    </div>` : `<button class="btn" style="margin-top:14px" onclick="flipCard()">↩ Revelar resposta</button>`}`;
}

// ⚔️ FUNÇÃO DE INVOCAÇÃO DO CHEFÃO MANUAL (SISTEMA DE TICKETS)
// ⚔️ FUNÇÃO DE INVOCAÇÃO DO CHEFÃO MANUAL (Agora respeita categorias!)
function startBossMode(categoriaFiltro = null) {
    const DIRECT_COST = 150; 

    // Se a categoria não veio pelo modal, tenta pegar do dropdown da tela inicial (pro Banner funcionar)
    if (categoriaFiltro === null) {
        categoriaFiltro = document.getElementById('studyCatFilter')?.value || '';
    }

    // 🕵️‍♂️ FILTRA O SEU LÉXICO PELA CATEGORIA ESCOLHIDA
    let poolBase = W;
    if (categoriaFiltro && categoriaFiltro !== '') {
        poolBase = W.filter(w => w.category === categoriaFiltro);
    }

    // Trava de segurança da categoria
    if (poolBase.length < 5) {
        let msg = categoriaFiltro 
            ? `A categoria "${categoriaFiltro}" precisa de pelo menos 5 cartas para suportar uma arena!` 
            : 'Você precisa de pelo menos 5 cartas no léxico para duelar!';
        toast(msg, 'err');
        return;
    }

    if (!STATS.inventory) STATS.inventory = {};
    let hasTicket = (STATS.inventory.bossTickets > 0);

    if (!hasTicket) {
        if (!STATS.moedas || STATS.moedas < DIRECT_COST) {
            toast(`Você precisa de 🎟️ 1 Ticket ou ${DIRECT_COST} moedas de suborno para entrar!`, 'err');
            return;
        }
    }

    let msgConfirm = hasTicket 
        ? "⚔️ Você usará 🎟️ 1 Ticket do Coliseu para entrar na arena. Deseja enfrentar suas piores palavras?" 
        : `⚔️ Sem Tickets! O Guarda exige um suborno de ${DIRECT_COST} moedas. Deseja pagar o absurdo e entrar na arena?`;

    // Mostra na confirmação qual categoria você está invadindo!
    if (categoriaFiltro) {
        msgConfirm = `[Domínio: ${categoriaFiltro}]\n\n` + msgConfirm;
    }

    if (!confirm(msgConfirm)) {
        return;
    }

    if (hasTicket) STATS.inventory.bossTickets--;
    else STATS.moedas -= DIRECT_COST;

    if (typeof saveStats === 'function') saveStats();
    if (typeof updateHeader === 'function') updateHeader();

    // 🧠 INTELIGÊNCIA REFINADA: Busca sanguessugas SOMENTE dentro do pool da categoria!
    let bossPool = poolBase.filter(w => w.isLeech || (w.correctStreak || 0) < 2);
    
    // Se você não tiver erros nessa categoria, pega 5 cartas aleatórias dela
    if (bossPool.length === 0) {
        bossPool = [...poolBase].sort(() => Math.random() - 0.5).slice(0, 5);
    }
    const monstro = bossPool[Math.floor(Math.random() * bossPool.length)];

    // Fecha a janela de Modos Customizados se estiver aberta
    if (typeof closeModal === 'function') closeModal();

    // ⚔️ MONTA A SESSÃO
    studyMode = 'adaptive';
    studySession = {
        queue: [monstro],

}

function buildChoiceMode(card) {
  const sess = studySession;
  
  if (!sess.choices) {
    const valids = getValidAnswers(card);
    const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
    
    sess.validChoices = valids.sort(() => Math.random() - 0.5).slice(0, isRel ? 3 : 1);
    const totalOptions = isRel ? 6 : 4;
    
    let pool = W.filter(w => w.id !== card.id);
    const isLong = (c) => ['técnica', 'falácia', 'citação'].includes(c.cardType || 'normal');
    
    // ✨ O NOVO SISTEMA DE FILTRAGEM (Prioridade Absoluta por Idioma/Categoria)
    // O jogo procura opções no mesmo "idioma" comparando a categoria da carta atual.
    
    let langStrict = pool.filter(w => w.category === card.category && w.cardType === card.cardType && w.wordClass === card.wordClass && card.wordClass);
    let langType   = pool.filter(w => w.category === card.category && w.cardType === card.cardType);
    let langOnly   = pool.filter(w => w.category === card.category);
    
    // Fallbacks originais (se a pessoa não tiver categorias, usa o padrão antigo)
    let t1 = pool.filter(w => w.cardType === card.cardType && w.wordClass === card.wordClass && card.wordClass);
    let t2 = pool.filter(w => w.cardType === card.cardType);
    let t3 = pool.filter(w => isLong(w) === isLong(card));

    // 🧠 A Inteligência: Escolhe as iscas na ordem de perfeição do idioma!
    let othersCards = langStrict.length >= 3 ? langStrict 
                    : (langType.length >= 3 ? langType 
                    : (langOnly.length >= 3 ? langOnly 
                    : (t1.length >= 3 ? t1 
                    : (t2.length >= 3 ? t2 
                    : (t3.length >= 3 ? t3 : pool)))));

    let others = [];

    // Extrai as opções da lista de elite
    if (isRel) {
      others = othersCards.flatMap(w => (w.cardType === 'sinônimo' || w.cardType === 'antônimo') ? getValidAnswers(w) : [w.word]);
      
      // Se faltar opções, preenche com palavras do MESMO IDIOMA (Categoria) primeiro!
      if (others.length < totalOptions) {
         let backup = langOnly.length > 0 ? langOnly : pool;
         others = [...others, ...backup.map(w => w.word)];
      }
    } else {
      others = othersCards.flatMap(w => (w.cardType === 'sinônimo' || w.cardType === 'antônimo') ? [] : getValidAnswers(w));
      
      if (others.length < totalOptions) {
         let backup = langOnly.length > 0 ? langOnly : pool;
         // Proteção para o 'clean' existir no ambiente
         others = [...others, ...backup.filter(w => w.cardType !== 'sinônimo' && w.cardType !== 'antônimo').map(w => typeof clean === 'function' ? clean(w.definition) : (w.definition || w.word))];
      }
    }
    
    others = [...new Set(others)].filter(opt => !sess.validChoices.includes(opt));
    
    // 🛡️ Segurança Máxima: Se o jogador tiver pouquíssimas cartas cadastradas no total
    // força o preenchimento com qualquer coisa para a tela não quebrar
    if (others.length < (totalOptions - sess.validChoices.length)) {
         let absoluteBackup = pool.map(w => isRel ? w.word : (typeof clean === 'function' && w.definition ? clean(w.definition) : (w.definition || w.word)));
         others = [...new Set([...others, ...absoluteBackup])].filter(opt => !sess.validChoices.includes(opt));
    }

    const wrongs = others.sort(() => Math.random() - 0.5).slice(0, totalOptions - sess.validChoices.length);
    sess.choices = [...sess.validChoices, ...wrongs].sort(() => Math.random() - 0.5);
  }
  
  const answered = sess.choiceAnswered;
  if (typeof atualizarCorDeFundo === 'function') atualizarCorDeFundo(card.cardType);
  const typeLbl = card.cardType === 'sinônimo' ? `Selecione um ${hl('sinônimo')} para:` : (card.cardType === 'antônimo' ? `Selecione um ${hl('antônimo')} para:` : 'Qual a definição de:');

  return `
    <div class="card" style="margin-bottom:12px">
      <div class="card-body" style="text-align:center">
        <div class="fc-type" style="margin-bottom:10px">${typeLbl}</div>
        ${typeof renderVisual === 'function' ? renderVisual(card) : ''} <div class="fc-word">${esc(card.word)}</div>
      </div>
    </div>
    <div id="choices" style="${sess.choices.length > 4 ? 'display:grid;grid-template-columns:1fr 1fr;gap:6px' : ''}">
      ${sess.choices.map((ch, i) => {
        let cls = 'choice-opt';
        if (answered) {
          if (sess.validChoices.includes(ch)) cls += ' correct';
          else if (ch === sess.choiceSelected) cls += ' wrong reveal';
          else cls += ' reveal';
        }
        
        // ✨ BÔNUS DE UX: Adiciona as letras de A a F nas alternativas!
        const letras = ['A', 'B', 'C', 'D', 'E', 'F'];
        
        return `<div class="${cls}" style="margin-bottom:8px; font-size:14px; padding:12px; display:flex; align-items:center;" onclick="${answered ? '' : `choiceAnswer(${i})`}">
   <span style="opacity:0.4; margin-right:12px; font-weight:bold; font-family:'Cinzel',serif;">${letras[i]}.</span> 
   <span style="flex:1; text-align:left;">${esc(ch)}</span>
</div>`;
      }).join('')}
    </div>
    ${answered ? `
    <div style="margin-top:6px">
      <div class="rating-row" style="margin-top:10px">
        <button class="rating-btn r1" onclick="rateCard(0)"><span class="rating-lbl">De novo</span></button>
        <button class="rating-btn r${sess.choiceCorrect ? '4' : '2'}" onclick="rateCard(${sess.choiceCorrect ? 3 : 1})"><span class="rating-lbl">${sess.choiceCorrect ? 'Fácil ✓' : 'Difícil'}</span></button>
      </div>
    </div>` : ''}`;
}

function buildRevChoiceMode(card) {
  const sess = studySession;
  
  if (!sess.revChoices) {
    const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
    let pool = W.filter(w => w.id !== card.id);
    const isLong = (c) => ['técnica', 'falácia', 'citação'].includes(c.cardType || 'normal');
    
    // ✨ O NOVO SISTEMA DE FILTRAGEM (Prioridade Absoluta por Idioma/Categoria)
    let langStrict = pool.filter(w => w.category === card.category && w.cardType === card.cardType && w.wordClass === card.wordClass && card.wordClass);
    let langType   = pool.filter(w => w.category === card.category && w.cardType === card.cardType);
    let langOnly   = pool.filter(w => w.category === card.category);

    let t1 = pool.filter(w => w.cardType === card.cardType && w.wordClass === card.wordClass && card.wordClass);
    let t2 = pool.filter(w => w.cardType === card.cardType);
    let t3 = pool.filter(w => isLong(w) === isLong(card));

    // 🧠 A Inteligência: Escolhe as palavras falsas priorizando a mesma categoria (Idioma)
    let othersCards = langStrict.length >= 3 ? langStrict 
                    : (langType.length >= 3 ? langType 
                    : (langOnly.length >= 3 ? langOnly 
                    : (t1.length >= 3 ? t1 
                    : (t2.length >= 3 ? t2 
                    : (t3.length >= 3 ? t3 : pool)))));

    // Extrai as palavras e garante que não haja repetições e nem a resposta certa no meio
    let othersWords = [...new Set(othersCards.map(w => w.word))].filter(w => w !== card.word);

    // 🛡️ Segurança: Se depois de filtrar não sobrarem 3 palavras falsas, puxa do baralho todo
    if (othersWords.length < 3) {
        let backupWords = [...new Set(pool.map(w => w.word))].filter(w => w !== card.word);
        othersWords = [...othersWords, ...backupWords];
    }

    // Sorteia as 3 iscas e mistura com a palavra certa
    const shuffled = othersWords.sort(() => Math.random() - .5).slice(0, 3);
    sess.revChoices = [...shuffled, card.word].sort(() => Math.random() - .5);
    
    // ✨ LIMPANDO A PERGUNTA INVERSA COM SEGURANÇA:
    let def = typeof clean === 'function' && card.definition ? clean(card.definition) : (card.definition || "");
    if (isRel) {
       const valids = getValidAnswers(card);
       def = valids[Math.floor(Math.random() * valids.length)];
    }
    sess.revChoicePrompt = def;
  }
  
  const answered = sess.revChoiceAnswered;
  
  if (typeof atualizarCorDeFundo === 'function') atualizarCorDeFundo(card.cardType);
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
  const promptTxt = isRel ? `Qual palavra possui este ${hl(card.cardType)}:` : 'Qual é a palavra para esta definição:';

  return `
    <div class="card" style="margin-bottom:12px">
      <div class="card-body" style="text-align:center">
        <div class="fc-type" style="margin-bottom:10px">${promptTxt}</div>
        ${typeof renderVisual === 'function' ? renderVisual(card) : ''}
        <div class="fc-definition" style="font-size:20px; font-weight:bolder; color:var(--gold); line-height:1.6">
          "${esc(sess.revChoicePrompt)}"
        </div>
      </div>
    </div>
    
    <div id="choices" style="${sess.revChoices.length > 4 ? 'display:grid;grid-template-columns:1fr 1fr;gap:6px' : ''}">
      ${sess.revChoices.map((ch, i) => {
        let cls = 'choice-opt';
        if (answered) {
          if (ch === card.word) cls += ' correct';
          else if (ch === sess.revChoiceSelected) cls += ' wrong reveal';
          else cls += ' reveal';
        }
        
        // ✨ BÔNUS DE UX: Adiciona as letras de A a D com estilo elegante e alinha a palavra à esquerda
        const letras = ['A', 'B', 'C', 'D', 'E', 'F'];
        
        return `<div class="${cls}" style="margin-bottom:8px; padding:12px; display:flex; align-items:center;" onclick="${answered ? '' : `revChoiceAnswer(${i})`}">
           <span style="opacity:0.4; margin-right:12px; font-weight:bold; font-family:'Cinzel',serif; font-size:14px;">${letras[i]}.</span> 
           <span style="flex:1; text-align:left; font-family:'Cinzel',serif; font-weight:600; font-size:16px;">${esc(ch)}</span>
        </div>`;
      }).join('')}
    </div>
    
    ${answered ? `
    <div style="margin-top:6px">
      <div class="rating-row" style="margin-top:10px">
        <button class="rating-btn r1" onclick="rateCard(0)"><span class="rating-lbl">De novo</span></button>
        <button class="rating-btn r${sess.revChoiceCorrect ? '4' : '2'}" onclick="rateCard(${sess.revChoiceCorrect ? 3 : 1})">
          <span class="rating-lbl">${sess.revChoiceCorrect ? 'Fácil ✓' : 'Difícil'}</span>
        </button>
      </div>
    </div>` : ''}`;
}

function buildTFMode(card) {
  const sess = studySession;
  
  if (!sess.tfSetup) {
    const isCorrect = Math.random() > 0.5;
    let def = '';
    const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
    
    // ✨ LIMPANDO A RESPOSTA CORRETA:
    const correctAnswers = getValidAnswers(card);
    const correctDef = isRel ? correctAnswers[Math.floor(Math.random() * correctAnswers.length)] : (typeof clean === 'function' ? clean(card.definition) : card.definition);

    if (!isCorrect && W.length > 1) {
      let pool = W.filter(w => w.id !== card.id);
      const isLong = (c) => ['técnica', 'falácia', 'citação'].includes(c.cardType || 'normal');
      
      // ✨ A CASCATA DE IDIOMAS (Prioridade Absoluta por Categoria)
      let langStrict = pool.filter(w => w.category === card.category && w.cardType === card.cardType && w.wordClass === card.wordClass && card.wordClass);
      let langType   = pool.filter(w => w.category === card.category && w.cardType === card.cardType);
      let langOnly   = pool.filter(w => w.category === card.category);

      let t1 = pool.filter(w => w.cardType === card.cardType && w.wordClass === card.wordClass && card.wordClass);
      let t2 = pool.filter(w => w.cardType === card.cardType);
      let t3 = pool.filter(w => isLong(w) === isLong(card));

      // Pega do mais restrito para o mais genérico (precisamos de apenas 1 isca)
      let othersCards = langStrict.length >= 1 ? langStrict 
                      : (langType.length >= 1 ? langType 
                      : (langOnly.length >= 1 ? langOnly 
                      : (t1.length >= 1 ? t1 
                      : (t2.length >= 1 ? t2 
                      : (t3.length >= 1 ? t3 : pool)))));

      let others = [];
      
      if (isRel) {
        others = othersCards.flatMap(w => (w.cardType === 'sinônimo' || w.cardType === 'antônimo') ? getValidAnswers(w) : [w.word]);
        if (others.length === 0) {
           let backup = langOnly.length > 0 ? langOnly : pool;
           others = backup.map(w => w.word);
        }
      } else {
        others = othersCards.flatMap(w => (w.cardType === 'sinônimo' || w.cardType === 'antônimo') ? [] : getValidAnswers(w));
        // ✨ LIMPANDO OS DISTRATORES AQUI TAMBÉM:
        if (others.length === 0) {
           let backup = langOnly.length > 0 ? langOnly : pool;
           others = backup.filter(w => w.cardType !== 'sinônimo' && w.cardType !== 'antônimo').map(w => typeof clean === 'function' ? clean(w.definition) : w.definition);
        }
      }
      
      // Filtro vital: A afirmação "Falsa" não pode, por coincidência, ser idêntica à "Verdadeira"
      others = [...new Set(others)].filter(opt => opt !== correctDef);
      
      if (others.length > 0) {
          def = others[Math.floor(Math.random() * others.length)];
          sess.tfIsCorrect = false;
      } else {
          // Fallback de segurança extrema: se der erro e não achar NADA falso, vira verdadeira
          def = correctDef;
          sess.tfIsCorrect = true; 
      }
    } else {
      sess.tfIsCorrect = true;
      def = correctDef;
    }
    sess.tfDefinition = def;
    sess.tfSetup = true;
  }
  
  const answered = sess.tfAnswered;
  
  // ✨ A MÁGICA DA COR: (Removi a duplicação que existia na função anterior)
  if (typeof atualizarCorDeFundo === 'function') atualizarCorDeFundo(card.cardType);
  const typeText = card.cardType === 'sinônimo' ? `Tem como ${hl('sinônimo')}:` : (card.cardType === 'antônimo' ? `Tem como ${hl('antônimo')}:` : 'Significa:');

  return `
    <div class="card" style="margin-bottom:12px;border:2px solid ${answered ? (sess.tfUserCorrect ? 'var(--green)' : 'var(--red)') : 'var(--border)'}">
      <div class="card-body" style="text-align:center;padding:24px 16px">
        ${typeof renderVisual === 'function' ? renderVisual(card) : ''}<div class="fc-word" style="font-size:32px;margin-bottom:16px">${esc(card.word)}</div>
        <div style="font-size:13px;color:var(--stone2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${typeText}</div>
        <div class="fc-definition" style="font-size:18px;">"${esc(sess.tfDefinition)}"</div>
      </div>
    </div>
    ${!answered ? `
    <div class="btn-row" style="margin-top:16px; display:flex; gap:8px;">
      <button class="btn success" style="padding:14px; font-size:14px; flex:1" onclick="checkTF(true)">✓ Verdadeiro</button>
      <button class="btn danger" style="padding:14px; font-size:14px; flex:1" onclick="checkTF(false)">✕ Falso</button>
    </div>` : `
    <div class="type-result ${sess.tfUserCorrect ? 'ok' : 'fail'}" style="margin-bottom:10px; text-align:center;">
      ${sess.tfUserCorrect ? '<b>✓ Acertou em cheio!</b>' : `<b>✗ Enganado!</b> A afirmação era <b>${sess.tfIsCorrect ? 'Verdadeira' : 'Falsa'}</b>.`}
    </div>
    ${!sess.tfIsCorrect && !sess.tfUserCorrect ? `<div class="quote" style="margin-bottom:10px">${card.cardType === 'sinônimo' ? 'Os sinônimos reais são:' : 'A definição real é:'} <br><b>${esc(typeof clean === 'function' ? clean(card.definition) : card.definition)}</b></div>` : ''}
    <div class="rating-row">
      <button class="rating-btn r1" onclick="rateCard(0)"><span class="rating-lbl">De novo</span></button>
      <button class="rating-btn r${sess.tfUserCorrect ? '4' : '2'}" onclick="rateCard(${sess.tfUserCorrect ? 3 : 1})">
        <span class="rating-lbl">${sess.tfUserCorrect ? 'Correto ✓' : 'Difícil'}</span>
      </button>
    </div>`}`;
}

function buildContextMode(card) {
  const sess = studySession;
  const answered = sess.contextAnswered;
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
  let blanked = '', revealed = '';
  
  if (card.example) {
        let cleanEx = clean(card.example); 
        let targetWord = clean(card.word).trim(); 
        
        // ✨ O CÃO DE GUARDA DEFINITIVO (Blindagem contra Acentos e Maiúsculas)
        // Removemos TODOS os acentos da frase e da palavra só para fazer a busca
        const normEx = cleanEx.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        const normWord = targetWord.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        
        // Pega a raiz da palavra limpa (sem acento)
        let rootLen = Math.max(4, Math.floor(normWord.length * 0.8));
        let rootWord = normWord.substring(0, rootLen);
        
        // Como a frase agora não tem acentos na busca, o limite de palavra (\b) funciona com perfeição
        let regex = new RegExp('\\b' + escReg(rootWord) + '[a-z]*\\b', 'g');
        
        let matches = [];
        let m;
        while ((m = regex.exec(normEx)) !== null) {
            matches.push({ start: m.index, end: m.index + m[0].length });
        }
        
        let bArr = [], rArr = [], lastIdx = 0;
        
        // Monta a frase recortando as palavras originais (preservando os acentos reais na tela)
        for (let i = 0; i < matches.length; i++) {
            const match = matches[i];
            const before = cleanEx.substring(lastIdx, match.start);
            const originalWord = cleanEx.substring(match.start, match.end);
            
            bArr.push(esc(before));
            rArr.push(esc(before));
            
            if (isRel) {
                // Sinônimo / Antônimo: Destaca a palavra
                bArr.push('<b style="color:var(--gold2); border-bottom: 2px dashed var(--gold2)">' + esc(originalWord) + '</b>');
                rArr.push('<mark>' + esc(originalWord) + '</mark>');
            } else {
                // Carta Normal: Esconde com o número exato de tracinhos!
                bArr.push('_ '.repeat(originalWord.length)); 
                rArr.push('<mark>' + esc(originalWord) + '</mark>');
            }
            lastIdx = match.end;
        }
        
        bArr.push(esc(cleanEx.substring(lastIdx)));
        rArr.push(esc(cleanEx.substring(lastIdx)));
        
        let bText = bArr.join('');
        let rText = rArr.join('');

        // ✨ HARDCORE CONTEXT (Esconde uma palavra extra se a carta for velha)
        if (!isRel && card.interval >= 7) {
            const words = cleanEx.split(/\s+/);
            const eligible = words.filter(w => {
                 let cleanW = w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[.,!?;:"'()]/g, '');
                 return cleanW.length > 5 && !cleanW.includes(rootWord);
            });
            if (eligible.length > 0) {
                const extraTarget = eligible[Math.floor(Math.random() * eligible.length)].replace(/[.,!?;:"'()]/g, '');
                const safeExtra = esc(extraTarget);
                bText = bText.replace(new RegExp('(' + escReg(safeExtra) + ')', 'g'), (match) => '<span style="opacity:0.3">' + '_'.repeat(match.length) + '</span>');
            }
        }
        
        blanked = bText;
        revealed = rText;
      } else {
    if (isRel) {
      blanked = `<span style="font-size:14px;color:var(--stone)">Palavra base:</span><br><b style="color:var(--gold2);font-size:20px">${esc(card.word)}</b><br><br>Digite UM ${hl(card.cardType)}: ______`;
      revealed = `<span style="font-size:14px;color:var(--stone)">Palavra base:</span><br><b style="color:var(--gold2);font-size:20px">${esc(card.word)}</b>`;
    } else {
      blanked = `<span style="font-size:14px;color:var(--stone)">Significa:</span><br><i>"${esc(clean(card.definition))}"</i><br><br>A palavra é: ______`;
      revealed = `<span style="font-size:14px;color:var(--stone)">Significa:</span><br><i>"${esc(clean(card.definition))}"</i><br><br>A palavra é: <mark>${esc(card.word)}</mark>`;
    }
  }
  
  const promptTxt = isRel ? `Complete com UM ${hl(card.cardType)}:` : 'Complete a lacuna:';
  const micLang = isRel ? (card.langDef || 'pt-BR') : (card.langWord || 'pt-BR');

  let html = `
    <div class="context-card">
      <div class="context-q">${promptTxt}</div>
      ${renderVisual(card)}<div class="context-text" id="ctxText">${answered ? revealed : blanked}</div>
    </div>`;

  if (!isRel) {
    html += `
    <div style="margin-bottom:10px">
      <div class="lbl">Definição contextual</div>
      <div style="font-size:15px;color:var(--ink2);font-style:italic;line-height:1.7">${esc(clean(card.definition))}</div>
    </div>`;
  }

  if (!answered) {
    html += `
    <div style="display:flex;gap:8px">
      <button class="btn ghost sm" id="hintBtn" onclick="useHint()" title="Usar Dica" style="padding:0 12px; font-size:18px; border-color:var(--border2)">💡</button>
      <button class="btn ghost sm" onclick="startDictation('ctxInput', '${micLang}', this)" title="Falar Resposta" style="padding:0 12px; font-size:18px; border-color:var(--border2)">🎙️</button>
      <input class="inp" id="ctxInput" placeholder="Escreva a palavra..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkContext()">
      <button class="btn gold" style="width:auto;padding:10px 16px" onclick="checkContext()">→</button>
    </div>
    <div id="hint-display" style="display:${sess.hintUsed ? 'block' : 'none'}; font-size:14px; color:var(--gold2); margin-top:10px; font-weight:600; text-align:center">
       ${sess.hintUsed ? `💡 <b>Dica:</b> ${sess.hintText}` : ''}
    </div>
    <button class="btn ghost" style="margin-top:8px" onclick="skipContext()">Ver resposta →</button>`;
  } else {
    html += `
    <div class="type-result ${sess.contextCorrect ? 'ok' : 'fail'}" style="margin-bottom:10px">
      ${sess.contextCorrect ? `✓ Excelente!` : `✗ Incorreto.`}
    </div>`;
    if (isRel) {
       html += `<div class="quote" style="margin-bottom:10px; border-color: ${sess.contextCorrect ? 'var(--green)' : 'var(--red)'}"><b>Opções válidas:</b><br><span style="color:var(--ink)">${esc(clean(card.definition))}</span></div>`;
    } else if (!sess.contextCorrect) {
       html += `<div class="quote" style="margin-bottom:10px; border-color: var(--red)">A palavra correta era: "${esc(card.word)}"</div>`;
    }
    html += getRatingRowHtml(sess.contextCorrect, 'Perfeito ✓');
  }
  return html;
}

function buildSyntaxMode(card) {
  const sess = studySession;
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';

  if (!sess.syntaxSetup) {
    if (isRel && !card.example) {
      const valids = getValidAnswers(card);
      const targetsToFind = valids.sort(() => Math.random() - 0.5).slice(0, 4);
      sess.syntaxNeededCount = Math.min(3, targetsToFind.length);

      let others = W.filter(w => w.id !== card.id).flatMap(w => w.cardType === 'sinônimo' || w.cardType === 'antônimo' ? getValidAnswers(w) : [w.word]);
      if (others.length < 6) others = [...others, "inefável", "assertivo", "prolixo", "efêmero", "pragmático", "eloquente"];
      
      const fakes = [...new Set(others)].filter(opt => !valids.includes(opt)).sort(() => Math.random() - 0.5).slice(0, 6);
      const poolWords = [...targetsToFind, ...fakes].sort(() => Math.random() - 0.5);
      
      sess.syntaxPool = poolWords.map((w, i) => ({ id: i, word: clean(w) }));
      sess.syntaxTargetWords = valids; 
      sess.isSynonymMatch = true;
    } else {
      const textToOrder = clean(card.example || card.definition);
      const words = textToOrder.split(/\s+/).filter(Boolean);
      sess.syntaxTarget = textToOrder;
      sess.syntaxPool = words.map((w, i) => ({ id: i, word: w })).sort(() => Math.random() - 0.5);
      sess.isSynonymMatch = false;
    }
    sess.syntaxAnswer = [];
    sess.syntaxSetup = true;

    <div class="type-result ${sess.syntaxCorrect ? 'ok' : 'fail'}" style="margin-bottom:10px">
      ${sess.syntaxCorrect ? `✓ Excelente!` : `✗ Incorreto.`}
      <div style="margin-top:6px;font-size:14px;color:var(--ink);font-style:italic">${feedbackTxt}</div>
    </div>
    ${getRatingRowHtml(sess.syntaxCorrect, 'Correto ✓')}`}
  `;
}

function buildClozeMode(card) {
  const sess = studySession;
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
  
  // 🛡️ O Normalizador Paranoico (Ignora maiúsculas, acentos e pontuações)
  const norm = (str) => (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[.,!?;:"'()]/g, '').toLowerCase().trim();

  if (!sess.clozeSetup) {
    let text = "", blanks = [], poolWords = [], isRelList = false;

    let pool = typeof W !== 'undefined' ? W.filter(w => w.id !== card.id) : [];
    let sameCat = pool.filter(w => w.category === card.category);
    let langStrict = sameCat.filter(w => w.cardType === card.cardType && w.wordClass === card.wordClass && card.wordClass);
    let langType   = sameCat.filter(w => w.cardType === card.cardType);

    let othersCards = langStrict.length >= 4 ? langStrict : (langType.length >= 4 ? langType : sameCat);

    let isCatEnglish = card.category && (card.category.toLowerCase().includes('inglês') || card.category.toLowerCase().includes('english') || card.category.toLowerCase() === 'en' || card.category.toLowerCase().includes('ingles'));
    let fakeWordsRel = isCatEnglish ? ["actually", "perhaps", "however", "therefore", "besides"] : ["inefável", "assertivo", "prolixo", "efêmero", "pragmático"];
    let fakeWordsNormal = isCatEnglish ? ["actually", "nevertheless", "therefore", "although", "furthermore", "meanwhile", "otherwise", "perhaps"] : ["intrínseco", "efêmero", "pragmático", "eloquente", "inefável", "prolixo", "sagaz", "peculiar"];

    const rawValids = typeof getValidAnswers === 'function' ? getValidAnswers(card) : [];
    const validsLimpos = rawValids.map(v => v.trim()).filter(v => v.length > 0);

    if (isRel && !card.example && !card.contextPhrase) {
      isRelList = true;
      const numBlanks = Math.min(3, validsLimpos.length);
      blanks = validsLimpos.sort(() => Math.random() - 0.5).slice(0, numBlanks);
      text = Array(numBlanks).fill('___').join(' &nbsp;•&nbsp; ');
      
      let others = othersCards.flatMap(w => w.cardType === 'sinônimo' || w.cardType === 'antônimo' ? getValidAnswers(w) : [w.word]);
      if (others.length < 6) {
          others = [...others, ...fakeWordsRel]; 
          if (others.length < 6) others = [...others, ...pool.map(w => w.word)];
      }

      let fakes = [...new Set(others)].filter(opt => !validsLimpos.map(norm).includes(norm(opt))).sort(() => Math.random() - 0.5).slice(0, 5);
      poolWords = [...blanks, ...fakes];
    } else {
      text = card.contextPhrase || (isRel ? card.example : card.definition); 
      let matches = [...text.matchAll(/\*([^*]+)\*/g)];
      if (matches.length > 0) {
         matches.forEach(m => blanks.push(m[1].trim()));
         text = text.replace(/\*([^*]+)\*/g, '___');
      } else {
         let words = text.split(/\s+/);
         let eligible = words.filter(w => w.replace(/[.,!?;:"'()]/g, '').length > 4);
         let selectedToHide = eligible.sort(() => Math.random() - 0.5).slice(0, 2); 
         let newTextArr = [];
         words.forEach(w => {
           if (selectedToHide.includes(w)) {
             let cleanWord = w.replace(/[.,!?;:"'()]/g, '');
             blanks.push(cleanWord); 
             newTextArr.push(w.replace(cleanWord, '___'));
             selectedToHide.splice(selectedToHide.indexOf(w), 1);
           } else {
             newTextArr.push(w);
           }
         });
         text = newTextArr.join(' ');
      }
      
      let others = othersCards.map(w => w.word);
      if (others.length < 8) {
          others = [...others, ...fakeWordsNormal]; 
          if (others.length < 8) others = [...others, ...pool.map(w => w.word)];
      }
      
      const numFakes = Math.max(4, 7 - blanks.length); 
      const fakes = [...new Set(others)]
        .filter(opt => !blanks.map(norm).includes(norm(opt)) && norm(opt) !== norm(card.word))
        .sort(() => Math.random() - 0.5).slice(0, numFakes);

      poolWords = [...blanks, ...fakes];
    }

    sess.clozeValidAlternatives = {};
    let extraValids = [];
    
    blanks.forEach((b, i) => {
        sess.clozeValidAlternatives[i] = [norm(b)]; 
        
        // 🚨 SE FOR SINÔNIMO/ANTÔNIMO: DELETA A PALAVRA ORIGINAL! 🚨
        if (norm(b) === norm(card.word) && isRel) {
            sess.clozeValidAlternatives[i] = []; // Esvazia! Só aceita o que vier da lista abaixo!
            
            validsLimpos.forEach(v => {
                let vNorm = norm(v);
                if (!sess.clozeValidAlternatives[i].includes(vNorm)) {
                    sess.clozeValidAlternatives[i].push(vNorm);
                    extraValids.push(v); // Guarda para criar o botão
                }
            });
        }
    });

    poolWords = [...poolWords, ...extraValids];
    
    // 🚨 BANIMENTO VISUAL TOTAL DA PALAVRA ORIGINAL 🚨
    if (isRel) {
        poolWords = poolWords.filter(w => norm(w) !== norm(card.word));
    }

    sess.clozeText = text; 
    sess.clozeAnswers = blanks; 
    
    // Limpa botões duplicados perfeitamente
    let finalPool = [];
    let seenNorms = new Set();
    poolWords.forEach(w => {
        let n = norm(w);
        if(!seenNorms.has(n)) {
            seenNorms.add(n);
            finalPool.push(w);
        }
    });
    
    sess.clozePool = finalPool.map((w,i)=>({id:i, word: w.replace(/[.,!?;:"'()]/g, '').trim()})).sort(() => Math.random() - 0.5);
    sess.clozeUserAnswers = []; sess.clozeIsRelList = isRelList; sess.clozeSetup = true;
  }
  
  const answered = sess.clozeAnswered;
  if (typeof atualizarCorDeFundo === 'function') atualizarCorDeFundo(card.cardType);
  let displayText = sess.clozeText, slotIndex = 0;
  
  displayText = displayText.replace(/___/g, () => {
     if (slotIndex < sess.clozeUserAnswers.length) {
        const pickedId = sess.clozeUserAnswers[slotIndex++];
        const word = sess.clozePool.find(p=>p.id === pickedId).word;
        return `<span style="color:var(--gold2);text-decoration:underline;cursor:pointer" onclick="${answered?'':`clozeRemove(${pickedId})`}">${esc(word)}</span>`;
     } else {
        slotIndex++;
        return `<span style="opacity:0.3">______</span>`;
     }
  });

  const availHtml = sess.clozePool.filter(p => !sess.clozeUserAnswers.includes(p.id)).map(item => {
    return `<button class="btn ghost sm" style="padding:6px 12px;font-size:14px;width:auto;border-color:var(--border2);text-transform:none;letter-spacing:normal" onclick="${answered?'':`clozeAdd(${item.id})`}">${esc(item.word)}</button>`;
  }).join('');

  // ✨ TEXTO DINÂMICO
  let promptTxt = 'Preencha as lacunas na ordem:';
  if (sess.clozeIsRelList) {
      promptTxt = `Selecione ${sess.clozeAnswers.length} ${hl(card.cardType + 's')}:`;
  } else if (isRel) {
      promptTxt = `Preencha com um ${hl(card.cardType)}:`; 
  }
  
  let contextHtml = '';
  if (card.contextHint && !sess.clozeIsRelList) {
      contextHtml = `<div style="font-size:13px; color:var(--stone2); background:rgba(212, 175, 55, 0.1); border:1px dashed var(--gold); padding:8px; border-radius:6px; margin-bottom:12px;"><b>🎭 Situação:</b> ${card.contextHint}</div>`;
      promptTxt = isRel ? `Complete a situação com um ${hl(card.cardType)}:` : 'Complete a frase para esta situação:';
  }

  return `
    <div class="card" style="margin-bottom:12px">
      <div class="card-body" style="text-align:center">
        <div class="fc-type" style="margin-bottom:8px">${promptTxt}</div>
        ${contextHtml}
        ${typeof renderVisual === 'function' ? renderVisual(card) : ''}
        ${(card.cardType !== 'citação' && !card.contextHint) ? `<div class="fc-word" style="font-size:20px;margin-bottom:12px">${esc(card.word)}</div>` : ''}
        <div style="font-size:18px;line-height:1.6;color:var(--ink);font-style:italic;margin-bottom:16px;text-align:${sess.clozeIsRelList ? 'center' : 'left'};padding:10px;background:rgba(0,0,0,0.2);border-radius:var(--r)">
          ${sess.clozeIsRelList ? displayText : `"${displayText}"`}
        </div>
        ${!answered && availHtml ? `<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${availHtml}</div>` : ''}
      </div>
    </div>
    ${!answered ? `
    <div style="display:flex;gap:8px">
      <button class="btn ghost" style="flex:1; border-color:var(--gold2); color:var(--gold2)" id="hintBtn" onclick="useHint()">💡 Dica</button>
      <button class="btn ghost" style="flex:1" onclick="clozeClear()">⟲ Limpar</button>
      <button class="btn gold" style="flex:2" onclick="checkCloze()">Verificar →</button>
    </div>
    <div id="hint-display" style="display:${sess.hintUsed ? 'block' : 'none'}; font-size:14px; color:var(--gold2); margin-top:12px; font-weight:600; text-align:center">
       ${sess.hintUsed ? `💡 <b>Dica:</b> ${sess.hintText}` : ''}
    </div>` : `
    <div class="type-result ${sess.clozeCorrect ? 'ok' : 'fail'}" style="margin-bottom:10px">
      ${sess.clozeCorrect ? `✓ Excelente!` : `✗ Incorreto.`}
    </div>
    <div class="quote" style="margin-bottom:10px; border-color: ${sess.clozeCorrect ? 'var(--green)' : 'var(--red)'}">
       ${esc(card.definition || '')}
    </div>
    ${typeof getRatingRowHtml === 'function' ? getRatingRowHtml(sess.clozeCorrect, 'Correto ✓') : ''}`}
  `;
}

/* ── MODO: ESCOLHA VISUAL (DUOLINGO STYLE) ── */
function buildImgChoiceMode(card) {
  const sess = studySession;
  
  if (!sess.imgChoices) {
    // ✨ ESCUDO DE PROTEÇÃO MÁXIMA: Garante que não vai dar erro se a imagem for vazia
    const imgTarget = card.image || ''; 
    const isPhoto = imgTarget.startsWith('data:image');
    let others = [];

    if (isPhoto) {
      // Universo 1: A resposta certa é uma FOTO. Vamos puxar SÓ outras fotos do banco!
      others = W.filter(w => w.id !== card.id && w.image && w.image.startsWith('data:image')).map(w => w.image);
      
      // Se não tiver fotos suficientes no banco, preenche com emojis
      if (others.length < 3) {
        others = [...others, '🍎', '🚗', '🐱', '🎸', '💡', '🔥', '⚙️', '🌊', '🏛️', '🎭', '🌿', '⚡'];
      }
    } else {
      // Universo 2: A resposta certa é um EMOJI. Vamos puxar SÓ emojis do banco!
      others = W.filter(w => w.id !== card.id && w.image && !w.image.startsWith('data:image')).map(w => w.image);
      
      // Se não tiver emojis suficientes no banco, puxa da reserva
      if (others.length < 3) {
        others = [...others, '🍎', '🚗', '🐱', '🎸', '💡', '🔥', '⚙️', '🌊', '🏛️', '🎭', '🌿', '⚡'];
      }
    }
    
    // Remove duplicatas e tira a resposta certa do meio (se estiver por engano)
    others = [...new Set(others)].filter(img => img !== imgTarget).sort(() => Math.random() - 0.5).slice(0, 3);
    
    // Junta a resposta certa com as 3 erradas e embaralha tudo
    sess.imgChoices = [...others, imgTarget].sort(() => Math.random() - 0.5);
  }
  
  const answered = sess.imgChoiceAnswered;

  // Função interna para desenhar o quadrado perfeitamente, seja foto base64 ou emoji
  const renderSquare = (img) => {
    if (!img) return ''; // Proteção contra travamento
    if (img.startsWith('data:image')) {
      return `<div style="width:100%; height:100%; background-image:url('${img}'); background-size:cover; background-position:center;"></div>`;
    } else {
      return `<div style="font-size:60px; display:flex; align-items:center; justify-content:center; width:100%; height:100%">${esc(img)}</div>`;
    }
  };

  return `
    <div class="card" style="margin-bottom:12px">
      <div class="card-body" style="text-align:center">
        <div class="fc-type" style="margin-bottom:10px">Qual imagem representa:</div>
        <div class="fc-word">${esc(card.word)}</div>
      </div>
    </div>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px">
      ${sess.imgChoices.map((img, i) => {
        let borderColor = 'var(--border2)';
        let opacity = '1';
        let bg = 'var(--bg4)';
        
        if (answered) {
          if (img === card.image) {
            borderColor = 'var(--green)'; // Certa brilha verde
            bg = 'rgba(39,174,96,0.1)';
          } else if (img === sess.imgChoiceSelected) {
            borderColor = 'var(--red)'; // A que você errou fica vermelha
            bg = 'rgba(192,57,43,0.1)';
          } else {
            opacity = '0.4'; // As outras apagam
          }
        }
        
        return `
        <div style="aspect-ratio:1; border:3px solid ${borderColor}; border-radius:var(--r2); overflow:hidden; background:${bg}; opacity:${opacity}; cursor:pointer; transition:all 0.2s" 
             onclick="${answered ? '' : `imgChoiceAnswer(${i})`}">
          ${renderSquare(img)}
        </div>`;
      }).join('')}
    </div>
    
    ${answered ? `
    <div class="type-result ${sess.imgChoiceCorrect ? 'ok' : 'fail'}" style="margin-bottom:10px">
      ${sess.imgChoiceCorrect ? '✓ Excelente memória visual!' : '✗ Incorreto.'}
      <div style="font-size:13px;margin-top:4px;color:var(--stone2)">
        ${esc(clean(card.definition))}
      </div>
    </div>
    <div class="rating-row">
      <button class="rating-btn r1" onclick="rateCard(0)"><span class="rating-lbl">De novo</span></button>
      <button class="rating-btn r${sess.imgChoiceCorrect ? '4' : '2'}" onclick="rateCard(${sess.imgChoiceCorrect ? 3 : 1})">
        <span class="rating-lbl">${sess.imgChoiceCorrect ? 'Fácil ✓' : 'Difícil'}</span>
      </button>
    </div>` : ''}
  `;
}

function flipCard() {

  studySession.flipped = true;
  const fc = document.getElementById('flashcard');
  if (fc) fc.classList.add('flipped');

function rateCard(quality) {
  if (!studySession) return;
  const sess = studySession;
  const card = sess.queue[sess.current];
  if (!card) return;

  if (STATS.vidas === undefined || isNaN(STATS.vidas)) STATS.vidas = 3;

  // Descobre qual é o modo atual para o Pet não dar erro!
  const modoAtualDaCarta = sess.currentAdaptiveMode || studyMode;

  // 🧹 Função Faxineira: Empacotou todas as variáveis que você apagou do final!
  const limparTela = () => {
      sess.hintUsed = false; sess.hintText = '';
      sess.magicHintUsed = false; sess.magicHintVisible = false; sess.magicHintsActive = 0; 
      sess.miniShieldActive = false;
      sess.choices = null; sess.choiceAnswered = false;
      sess.typeAnswered = false; sess.contextAnswered = false;
      sess.tfSetup = false; sess.tfAnswered = false;
      sess.revChoices = null; sess.revChoiceAnswered = false;
      sess.scrambleSetup = false; sess.scrambledWord = null; sess.scrambleAnswered = false; 
      sess.spellSetup = false; sess.spellAnswered = false;
      sess.syntaxSetup = false; sess.syntaxAnswered = false;
      sess.clozeSetup = false; sess.clozeAnswered = false;
      sess.imgChoices = null; sess.imgChoiceAnswered = false;
      sess.blindAnswered = false; sess.blindAudioPlayed = false; 
      sess.bossAnswered = false; sess.bossAudioPlayed = false; 
      sess.flipped = false;
  };

  // ⚔️ O MOTOR DE BATALHA DO CHEFÃO
  if (sess.bossActive) {
      if (quality >= 2) {
          sess.bossHp--;
          if (sess.bossHp > 0) {
              // ACERTOU MAS O MONSTRO NÃO MORREU (O Monstro prepara o contra-ataque!)
              if (typeof toast === 'function') toast('🗡️ Acerto Crítico! O Monstro sangra! (-1 HP)', 'var(--green)');
              
              sess.bossTurn++;
              const bossAttacks = ['cloze', 'blind', 'spell', 'type', 'revchoice'];
              sess.currentAdaptiveMode = bossAttacks[sess.bossTurn % bossAttacks.length];
              
              limparTela(); // Limpa a tela para o contra-ataque
              setTimeout(playQuestionAudio, 200);
              render();
              return; 
          } else {
              // MATOU O MONSTRO!
              if (typeof toast === 'function') toast('👑 MONSTRO DERROTADO! Você saqueou o Baú!', 'var(--gold)');
              darLootDoChefe(); 
              sess.bossActive = false; 
          }
      } else {
          // ERROU! O MONSTRO TE ATACA!
          const hasInfShield = STATS.activeEvent && STATS.activeEvent.id === 'shields_inf';
          if (hasInfShield || sess.miniShieldActive) {
              sess.miniShieldActive = false; 
              if (typeof toast === 'function') toast('🛡️ O Escudo bloqueou as garras do Monstro!', 'var(--blue)');
          } else {
              sess.playerHp--;
              if (typeof toast === 'function') toast('🩸 O Monstro te feriu! (-1 HP)', 'var(--red)');
          }

          if (sess.playerHp > 0) {
              // SOBREVIVEU! A pergunta reseta para tentar de novo!
              limparTela();
              setTimeout(playQuestionAudio, 200);
              render();
              return; 
          } else {
              // MORREU
              if (typeof toast === 'function') toast('💀 Você foi engolido pelo Monstro... A carta fugiu.', 'var(--red)');
              sess.bossActive = false; 
          }
      }
  }

  // --- LÓGICA NORMAL DO APLICATIVO (SM-2 E VIDAS) ---
  if (!sess.isFreeMode) {
      const hasInfLives = STATS.activeEvent && STATS.activeEvent.id === 'lives_inf';
      const hasInfShield = STATS.activeEvent && STATS.activeEvent.id === 'shields_inf';

      if (quality === 0 && hasInfShield) {
          toast('🛡️ Égide Divina Ativa! Nenhuma penalidade no SM-2.', 'blue');
          sess.queue.push(card);
      } 
      else if (quality === 0 && sess.miniShieldActive) {
          sess.miniShieldActive = false; 
          toast('🛡️ Égide Menor ativada! O card foi protegido.', 'gold');
          sess.queue.push(card);
      } 
      else if (quality === 0 && hasInfLives) {
          toast('❤️‍🔥 Imortalidade Ativa! Sua vida não foi consumida.', 'red');
          sess.queue.push(card);
      } 
      else if (quality === 0 && STATS.vidas > 0) {
          if (!configJogo.vidasInfinitas) STATS.vidas--;
          toast('❤️ Vida consumida! O card foi protegido.', 'gold');
          sess.queue.push(card);
          if (typeof saveStats === 'function') saveStats();
      } 
      else {
          if (quality === 0) {
              toast('💔 Sem defesas! Penalidade aplicada.', 'err');
              sess.queue.push(card); 
          }

          const result = sm2(card, quality);
          const idx = W.findIndex(w => w.id === card.id);
          if (idx >= 0) {
              Object.assign(W[idx], result);
              W[idx].lastReview = Date.now();
              W[idx].totalReviews = (W[idx].totalReviews || 0) + 1;
              
              if (quality >= 2) {
                 W[idx].correctStreak = (W[idx].correctStreak || 0) + 1;
                 W[idx].consecutiveFails = 0; 
                 W[idx].isLeech = false;
              } else {
                 W[idx].correctStreak = 0;
                 W[idx].consecutiveFails = (W[idx].consecutiveFails || 0) + 1;
                 if (W[idx].consecutiveFails >= 4) W[idx].isLeech = true; 
              }
              
              const cardToSave = W.find(w => w.id === card.id);
              if (cardToSave) saveCard(cardToSave);
          }
          if (typeof saveStats === 'function') saveStats();
      }
  } else {
      if (quality === 0) sess.queue.push(card);
  }

  // BÔNUS DOS MASCOTES
  if (STATS.pets && STATS.pets.active) {
      const activePet = STATS.pets.active;
      const hasFreeFood = STATS.activeEvent && STATS.activeEvent.id === 'ev_pet_fed';
      const isFed = (STATS.pets.fedCharges > 0 || hasFreeFood) && !sess.isFreeMode;
      
      if (!STATS.pets.affinity) STATS.pets.affinity = {};
      if (STATS.pets.affinity[activePet] === undefined) STATS.pets.affinity[activePet] = 0;
      
      let ganhoAfin = (STATS.activeEvent && STATS.activeEvent.id === 'ev_pet_aff') ? 3 : 1;
      
      // ✨ A variável corrigida está sendo usada aqui!
      if (modoAtualDaCarta === 'flash' && sess.isFreeMode) {
          ganhoAfin = 0;
      }
      
      STATS.pets.affinity[activePet] += ganhoAfin;

      if (typeof isPetCapped === 'function' && isPetCapped(activePet)) {
          if (Math.random() < 0.15) {
              toast(`⚠️ Poder do ${activePet.toUpperCase()} estagnou! XP salvo em 2º plano. Evolua-o!`, 'var(--red)');
          }
      }
  }

  setTimeout(playQuestionAudio, 200);

  sess.answered++;
  if (quality >= 2) sess.correct++;
  sess.current++;
  
  // Limpa a tela para a PRÓXIMA carta vir limpinha
  limparTela(); 
  sess.currentAdaptiveMode = null;
  render(); 
}

function choiceAnswer(idx) {
  const sess = studySession; if (!sess || sess.choiceAnswered) return;
  sess.choiceSelected = sess.choices[idx];

function checkType() {

  if (!sess || sess.typeAnswered) return;
  
  const card = sess.queue[sess.current]; 
  const inp = document.getElementById('typeInput'); 
  if (!inp) return;
  
  // Limpa acentos e espaços para ser justo com o jogador
  const normalizeTxt = (str) => (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const ans = normalizeTxt(inp.value); 
  const isRel = card.cardType === 'sinônimo' || card.cardType === 'antônimo';
  
  if (isRel) {
    const valids = getValidAnswers(card).map(v => normalizeTxt(v));
    // ✨ Inteligência extra: Só aceita erro de digitação (levenshtein) se a palavra for maior que 3 letras!
    sess.typeCorrect = valids.some(v => ans === v || (ans.length > 3 && levenshtein(ans, v) <= 1));
  } else {
    const correctWord = normalizeTxt(card.word);
    // ✨ Mesma regra aqui, evita aprovar palavras de 2 letras que não têm nada a ver.
    sess.typeCorrect = ans === correctWord || (ans.length > 3 && levenshtein(ans, correctWord) <= 1);
  }
  
  sess.typeAnswered = true;
  
  // ✨ O ESCUDO ANTI-BUG DA PLAYSFX: 
  // Se a variável isQuizNow não existir no jogo, nós a criamos invisível aqui mesmo!
  // Assim a playSfx lê ela, fica feliz e não trava o seu jogo.
  if (typeof isQuizNow === 'undefined') {
      window.isQuizNow = false; 
  }
  
  playSfx(sess.typeCorrect ? 'ok' : 'fail');
  render(); 
  
  if (typeof playAnswerAudio === 'function') {
      setTimeout(playAnswerAudio, 100);
  }
}

  } else {

  sess.contextAnswered = true;

function checkSyntax() {

    const userWords = sess.syntaxAnswer.map(id => normalizeTxt(sess.syntaxPool.find(p=>p.id===id).word));
    const targetWords = sess.syntaxTargetWords.map(w => normalizeTxt(w));
    const allCorrect = userWords.every(w => targetWords.includes(w));
    const enoughCount = userWords.length >= sess.syntaxNeededCount;
    sess.syntaxCorrect = userWords.length > 0 && allCorrect && enoughCount;
  } else {
    const userTxt = sess.syntaxAnswer.map(id => sess.syntaxPool.find(p=>p.id===id).word).join(' ');
    sess.syntaxCorrect = (userTxt === sess.syntaxTarget);
  }
  sess.syntaxAnswered = true;

}

function checkCloze() {
  const sess = studySession; 
  if (!sess || sess.clozeAnswered) return;
  
  const card = sess.queue[sess.current];
  const userWords = sess.clozeUserAnswers.map(id => sess.clozePool.find(p=>p.id===id).word);
  const expectedWords = sess.clozeAnswers;
  
  // O Normalizador Paranoico trabalha no Corretor também!
  const norm = (str) => (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[.,!?;:"'()]/g, '').toLowerCase().trim();
  
  if (sess.clozeIsRelList) {
    const valids = (typeof getValidAnswers === 'function' ? getValidAnswers(card) : []).map(norm);
    const userClean = userWords.map(norm);
    sess.clozeCorrect = userClean.length === expectedWords.length && userClean.every(w => valids.includes(w));
  } else {
    let allCorrect = true;
    
    if (userWords.length !== expectedWords.length) {
      allCorrect = false;
    } else {
      for (let i = 0; i < expectedWords.length; i++) {
        const uW = norm(userWords[i]); 
        
        // Puxa as regras que a tela de cima criou!
        let validOptionsParaEstaLacuna = [];
        if (sess.clozeValidAlternatives && sess.clozeValidAlternatives[i]) {
            validOptionsParaEstaLacuna = sess.clozeValidAlternatives[i].map(norm);
        } else {
            validOptionsParaEstaLacuna = [norm(expectedWords[i])];
        }
        
        // Compara com a lista validada (Onde "perspicaz" foi banido e "sagaz" é a única salvação!)
        if (validOptionsParaEstaLacuna.includes(uW)) {
            continue; 
        }
        
        allCorrect = false; 
        break;
      }
    }
    sess.clozeCorrect = allCorrect;
  }
  
  sess.clozeAnswered = true; 
  if (typeof playSfx === 'function') playSfx(sess.clozeCorrect ? 'ok' : 'fail');
  if (typeof playAnswerAudio === 'function') setTimeout(playAnswerAudio, 100); 
  if (typeof render === 'function') render();
}

function checkBoss() {
  const sess = studySession; if (!sess || sess.bossAnswered) return;
  const card = sess.queue[sess.current]; 
  
  const normalizeTxt = (str) => (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  
  // Função para checar se o que a pessoa digitou está dentro da lista (separada por vírgula)
  const checkMatchInList = (ans, targetListString) => {
      if (!ans || !targetListString) return false;
      const validOptions = targetListString.split(',').map(s => normalizeTxt(s));
      return validOptions.some(opt => opt === ans || levenshtein(ans, opt) <= 1);
  };

  // 1. Checa a Palavra Base
  const ansWord = normalizeTxt(document.getElementById('bossWord')?.value);
  const correctWord = normalizeTxt(card.word);
  let isWordCorrect = (ansWord === correctWord || levenshtein(ansWord, correctWord) <= 1);

  // 2. Checa o Sinônimo (se exigido)
  let isSynCorrect = true; 
  if (card.synonyms) {
      const ansSyn = normalizeTxt(document.getElementById('bossSyn')?.value);
      isSynCorrect = checkMatchInList(ansSyn, card.synonyms);
  }

  // 3. Checa o Antônimo (se exigido)
  let isAntCorrect = true;
  if (card.antonyms) {
      const ansAnt = normalizeTxt(document.getElementById('bossAnt')?.value);
      isAntCorrect = checkMatchInList(ansAnt, card.antonyms);
  }

  // A pessoa SÓ passa se acertar TUDO que foi exigido!
  sess.bossCorrect = isWordCorrect && isSynCorrect && isAntCorrect;
  sess.bossAnswered = true;
  
  playSfx(sess.bossCorrect ? 'ok' : 'fail');
  clearTimeout(sess.timerId); // Para o relógio
  
  render(); 
  setTimeout(playAnswerAudio, 100);
}

// ✨ VARIÁVEL DO DEBOUNCE (Guarda o cronômetro)
let searchTimeout = null; 

function handleSearchInput() {
  const inp = document.getElementById('wordSearch');
  const btn = document.getElementById('clearSearchBtn');
  if (btn && inp) btn.style.display = inp.value.length > 0 ? 'block' : 'none';
  
  // ✨ A MÁGICA DO DEBOUNCE: 
  // Se o usuário digitar outra letra rápido, ele cancela a busca anterior!
  if (searchTimeout) clearTimeout(searchTimeout);
  
  // Só executa a busca pesada se o usuário parar de digitar por 300 milissegundos
  searchTimeout = setTimeout(() => {
    wordDisplayLimit = 15; // Volta para os primeiros 15 ao pesquisar
    updateWordList();      // Atualiza a lista com segurança
  }, 300);
}

function clearSearch() {
  const inp = document.getElementById('wordSearch');
  if (inp) {
    inp.value = '';
    handleSearchInput(); // Atualiza a lista para mostrar tudo de novo
    inp.focus(); // Devolve o cursor piscando para a barra! 
  }
}

function handleFilterChange() {
  wordDisplayLimit = 15;
  updateWordList();
}

function loadMoreWords() {
  wordDisplayLimit += 15; // Aumenta o limite de 50 em 50 
  updateWordList();
}

function updateWordList() {
  const cont = document.getElementById('wordListCont');
  const countLbl = document.getElementById('wordCountLbl');
  if (!cont || !countLbl) return;

  const rawQ = document.getElementById('wordSearch')?.value || '';
  const cat = document.getElementById('wordCat')?.value || '';
  const sort = document.getElementById('wordSort')?.value || 'alpha';

  // Função mágica que remove acentos, 'ç', 'ã', 'é' e transforma em minúsculas
    const normalize = (str) => (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const q = normalize(rawQ);

  let list = [...W];
  if (q) {
    list = list.filter(w => 
      normalize(w.word).includes(q) || 
      normalize(w.definition).includes(q) || 
      normalize(w.tags).includes(q)
    );
  }

  if (cat) list = list.filter(w => w.category === cat);

  if (sort === 'alpha') list.sort((a,b) => a.word.localeCompare(b.word));
  else if (sort === 'due') list.sort((a,b) => a.nextReview - b.nextReview);
  else if (sort === 'new') list.sort((a,b) => b.createdAt - a.createdAt);
  else if (sort === 'hard') list.sort((a,b) => a.easeFactor - b.easeFactor);

  countLbl.textContent = `${list.length} palavra${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    cont.innerHTML = `<div class="empty"><div class="empty-icon">📖</div><div class="empty-title">Léxico vazio</div><div class="empty-desc">Nenhum resultado encontrado.</div></div>`;
    return;
  }

    // Corta a lista para mostrar apenas até o limite atual
  const visibleList = list.slice(0, wordDisplayLimit);

  let html = `<div class="card" style="margin-bottom:0">`;
  html += visibleList.map(w => `<div class="word-row ${getCardRarity(w).cls}" onclick="openWordDetail('${w.id}')">
    <div class="word-row-main">
      <div class="word-row-word">${w.cardType === 'sinônimo' ? '🔗 ' : (w.cardType === 'antônimo' ? '⚖️ ' : '')}${esc(w.word)}</div>
      <div class="word-row-def">${esc(clean(w.word))}: ${esc(clean(w.definition))}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
      <span class="badge ${getStatus(w)}">${statusLabel(getStatus(w))}</span>
      <div class="word-actions" onclick="event.stopPropagation()">
        <button class="mini-btn edit" onclick="openEditModal('${w.id}')">✏</button>
        <button class="mini-btn danger" onclick="confirmDelete('${w.id}')">✕</button>
      </div>
    </div>
  </div>`).join('');
  html += `</div>`;

    // Adiciona o botão "Carregar mais" se ainda houver palavras ocultas
    if (list.length > wordDisplayLimit) {
    html += `<button class="btn ghost" style="margin-top:12px" onclick="loadMoreWords()">↓ Carregar mais (${list.length - wordDisplayLimit} ocultas)</button>`;
  }

  cont.innerHTML = html;
}

  const inpWord = document.getElementById('fw_word');

  const inpDef = document.getElementById('fw_def');
  const hintObj = document.getElementById('fw_asterisk_hint');

  const grpEx = document.getElementById('grp_fw_ex');
  const inpEx = document.getElementById('fw_ex');
  
  const grpSynAnt = document.getElementById('grp_fw_syn_ant');
  const grpAntOnly = document.getElementById('grp_ant_only');
  const grpPhClass = document.getElementById('grp_fw_ph_class');

  if (!type || !opt || !lblDef || !inpDef) return;

  opt.style.display = 'block';
  if (grpEx) grpEx.style.display = 'block';
  if (grpSynAnt) grpSynAnt.style.display = 'flex'; 
  if (grpAntOnly) grpAntOnly.style.display = 'block'; 
  if (grpPhClass) grpPhClass.style.display = 'flex';
  if (hintObj) hintObj.style.display = 'block';

  if (type === 'universal') {
    lblWord.textContent = 'Palavra Base *';
    inpWord.placeholder = 'Ex: inteligente';
    lblDef.textContent = 'Definição *';
    inpDef.placeholder = 'Ex: Pessoa provida de inteligência, *sagaz*.';
    if(inpEx) inpEx.placeholder = 'Ex: O plano foi muito inteligente.';
  
  } else if (type === 'sinônimo' || type === 'antônimo') {
    if (hintObj) hintObj.style.display = 'none';
    if (grpPhClass) grpPhClass.style.display = 'none'; 
    if (grpAntOnly) grpAntOnly.style.display = 'none'; 
    
    lblWord.textContent = 'Palavra Base *';
    inpWord.placeholder = type === 'sinônimo' ? 'Ex: Lindo' : 'Ex: Quente';
    lblDef.textContent = `Lista de ${type}s (separados por vírgula) *`;
    inpDef.placeholder = type === 'sinônimo' ? 'Ex: belo, maravilhoso, deslumbrante' : 'Ex: feio, horrível, pavoroso';
    if(inpEx) inpEx.placeholder = type === 'sinônimo' ? 'Ex: O quadro que você pintou ficou lindo.' : 'Ex: Hoje o clima está quente.';

  } else if (type === 'normal') {
    lblWord.textContent = 'Palavra *';
    inpWord.placeholder = 'Ex: indelével';
    lblDef.textContent = 'Definição *';
    inpDef.placeholder = 'Ex: Que não se apaga; *permanente*; imorredouro.';
    if(inpEx) inpEx.placeholder = 'Ex: Sua memória deixou uma marca indelével na história.';

  } else if (type === 'conectivo') {
    if (grpSynAnt) grpSynAnt.style.display = 'none';
    if (grpPhClass) grpPhClass.style.display = 'none'; 
    
    lblWord.textContent = 'Conectivo / Expressão *';
    inpWord.placeholder = 'Ex: Outrossim';
    lblDef.textContent = 'Função / Uso na Frase *';
    inpDef.placeholder = 'Ex: Usado para *adicionar* um argumento com peso de *formalidade*.';
    if(inpEx) inpEx.placeholder = 'Ex: Outrossim, é fundamental destacar que a medida...';

  } else if (type === 'técnica') {
    if (grpSynAnt) grpSynAnt.style.display = 'none';
    if (grpPhClass) grpPhClass.style.display = 'none';
    
    lblWord.textContent = 'Nome da Técnica *';
    inpWord.placeholder = 'Ex: Feel, Felt, Found';
    lblDef.textContent = 'Estrutura / Passo a Passo *';
    inpDef.placeholder = 'Ex: 1. Mostre que *entende*. 2. Diga que *outros* também.';
    if(inpEx) inpEx.placeholder = 'Ex: Entendo que ache caro. Outros também acharam...';

  } else if (type === 'falácia') {
    if (grpSynAnt) grpSynAnt.style.display = 'none';
    if (grpPhClass) grpPhClass.style.display = 'none';
    
    lblWord.textContent = 'Nome da Falácia *';
    inpWord.placeholder = 'Ex: Ad Hominem';
    lblDef.textContent = 'Explicação / Definição *';
    inpDef.placeholder = 'Ex: Consiste em atacar a *pessoa* em vez do *argumento*.';
    if(inpEx) inpEx.placeholder = 'Ex: "Você diz isso, mas nem tem faculdade."';

  } else if (type === 'citação') {
    opt.style.display = 'none'; 
    lblWord.textContent = 'Autor da Citação *';
    inpWord.placeholder = 'Ex: Friedrich Nietzsche';
    lblDef.textContent = 'Frase / Citação *';
    inpDef.placeholder = 'Ex: Quem tem um *porquê* suporta qualquer *como*.';
  }
}

function buildWordForm(word) {
  const w = word || {};

  const existingCats = W.map(x => x.category).filter(Boolean);
  const cats = [...new Set([...defaultCats, ...existingCats])].sort();
  if (w.category && !cats.includes(w.category)) cats.push(w.category);
  
  const classes = ['','substantivo','verbo','adjetivo','advérbio','expressão','locução'];
  const bgStyle = (w.image && w.image.startsWith('data:image')) ? `background-image:url('${w.image}');` : '';
  
  // ✨ FUNÇÃO MÁGICA PARA CRIAR O MINI-SELETOR DE IDIOMA

      <input class="inp" id="fw_emoji_inp" placeholder="Ou digite um emoji..." style="text-align:center; max-width:200px; margin:0 auto" oninput="handleEmojiUpload(event)" value="${w.image && !w.image.startsWith('data:image') ? w.image : ''}">
    </div>

      <div class="form-group" style="flex:1;margin:0">
        <label class="lbl">Tipo de Card</label>

    <div class="form-group">

      <div style="display:flex">
         ${lSel('fw_lang_word', w.langWord)}

/* ── STATS TAB ── */
function buildStatsTab() {
  const total = W.length;
  const mastered = W.filter(w => getStatus(w) === 'mastered').length;
  const pct = total ? Math.round((mastered / total) * 100) : 0;
  const avgEase = total ? (W.reduce((s, w) => s + w.easeFactor, 0) / total).toFixed(2) : '—';
  const totalRev = STATS.totalReviews || 0;
  const days = [...new Set((STATS.history||[]).map(h => h.date))].length;
  
  // ✨ LÓGICA DO HEATMAP (30 DIAS COM CONTAGEM)
  const last30 = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); 
    d.setDate(d.getDate() - i);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    const dt = d.toISOString().slice(0,10);
    
    // Pega o histórico desse dia específico e soma todas as revisões feitas nele
    const histDay = (STATS.history||[]).filter(h => h.date === dt);
    const revCount = histDay.reduce((acc, curr) => acc + curr.total, 0);
    
    last30.push({date: dt, count: revCount, isToday: i === 0});
  }

  const catMap = {};
  W.forEach(w => { catMap[w.category||'geral'] = (catMap[w.category||'geral']||0) + 1; });

  return `
    <div class="card">
      <div class="card-head"><div class="card-title">⚑ Progresso Geral</div></div>
      <div class="card-body">
        <div class="ring-wrap">
          <svg class="ring" width="120" height="120" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="50" stroke-width="8"/>
            <circle class="ring-fill" cx="60" cy="60" r="50" stroke-width="8"
              stroke-dasharray="${2 * Math.PI * 50}"
              stroke-dashoffset="${2 * Math.PI * 50 * (1 - pct/100)}"/>
            <text class="ring-label" x="60" y="58" text-anchor="middle" dominant-baseline="middle" transform="rotate(90,60,60)">${pct}%</text>
            <text class="ring-sub" x="60" y="72" text-anchor="middle" transform="rotate(90,60,60)">dominado</text>
          </svg>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-val">${total}</div><div class="stat-lbl">Palavras</div></div>
          <div class="stat-box"><div class="stat-val">${mastered}</div><div class="stat-lbl">Dominadas</div></div>
          <div class="stat-box"><div class="stat-val">${totalRev}</div><div class="stat-lbl">Revisões</div></div>
          <div class="stat-box"><div class="stat-val">${days}</div><div class="stat-lbl">Dias ativos</div></div>
          <div class="stat-box"><div class="stat-val">${STATS.streak||0}🔥</div><div class="stat-lbl">Sequência</div></div>
          <div class="stat-box"><div class="stat-val">${avgEase}</div><div class="stat-lbl">Facilidade média</div></div>
        </div>
      </div>
    </div>
    
    <!-- ✨ O NOVO GRÁFICO DE CALOR -->
    <div class="card">
      <div class="card-head"><div class="card-title">📅 Constância (Últimos 30 Dias)</div></div>
      <div class="card-body">
        <div style="display:grid; grid-template-columns: repeat(10, 1fr); gap:6px; margin-bottom:12px">
          ${last30.map(d => {
            let bg = 'var(--bg3)'; // Cinza Vazio
            if (d.count > 0 && d.count <= 10) bg = 'rgba(212,175,55, 0.3)'; // Dourado Fraco
            else if (d.count > 10 && d.count <= 30) bg = 'rgba(212,175,55, 0.6)'; // Dourado Médio
            else if (d.count > 30) bg = 'var(--gold)'; // Dourado Forte (Ouro Puro)

            return `<div title="${d.date}: ${d.count} revisões" style="aspect-ratio:1; border-radius:4px; background:${bg}; ${d.isToday ? 'border:2px solid var(--ink); transform:scale(1.1)' : ''}"></div>`;
          }).join('')}
        </div>
        <div style="display:flex; justify-content:flex-end; align-items:center; gap:6px; font-size:10px; color:var(--stone); text-transform:uppercase; letter-spacing:1px">
          <span>Menos</span>
          <div style="width:12px; height:12px; border-radius:3px; background:var(--bg3)"></div>
          <div style="width:12px; height:12px; border-radius:3px; background:rgba(212,175,55, 0.3)"></div>
          <div style="width:12px; height:12px; border-radius:3px; background:rgba(212,175,55, 0.6)"></div>
          <div style="width:12px; height:12px; border-radius:3px; background:var(--gold)"></div>
          <span>Mais</span>
        </div>
      </div>
    </div>

    ${Object.keys(catMap).length > 0 ? `
    <div class="card">
      <div class="card-head"><div class="card-title">📚 Por Categoria</div></div>
      <div class="card-body">
        ${Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([cat,cnt]) => {
          const cpct = Math.round((cnt/total)*100);
          return `<div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-family:'Cinzel',serif;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--stone3)">${esc(cat)}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--stone)">${cnt} · ${cpct}%</span>
            </div>
            <div class="prog-bar" style="margin:0"><div class="prog-fill" style="width:${cpct}%"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
    <div class="card">
      <div class="card-head"><div class="card-title">⚡ Distribuição SM-2</div></div>
      <div class="card-body">
        ${['new','learning','review','mastered','due'].map(s => {
          const cnt = W.filter(w => getStatus(w) === s).length;
          const p = total ? Math.round((cnt/total)*100) : 0;
          return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
